name: Monitor TheShy Ranked Status

on:
  schedule:
    # 注意: GitHub Actions cron 用 UTC, 最小粒度 5 分钟但常会延迟
    # 每 5 分钟跑一次 (实际触发可能 5-15 分钟一次)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: '强制推送测试通知 (不管状态变化)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'theshy_opgg_monitor.py'
      - 'requirements.txt'
      - '.github/workflows/theshy-monitor.yml'
      - 'index.html'
      - 'config.json'

concurrency:
  group: theshy-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      should_deploy: ${{ steps.check_changes.outputs.should_deploy }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        id: run_monitor
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          THESHY_RIOT_ID: ${{ secrets.THESHY_RIOT_ID }}
          THESHY_REGION: ${{ secrets.THESHY_REGION }}
          THESHY_ACCOUNTS: ${{ secrets.THESHY_ACCOUNTS }}
          QUIET_START: ${{ secrets.QUIET_START }}
          QUIET_END: ${{ secrets.QUIET_END }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify }}
        run: |
          # 强制测试通知模式 - 不提交数据也不部署
          if [ "$FORCE_NOTIFY" = "true" ]; then
            python3 theshy_opgg_monitor.py --test-notify
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          # 正常单次检测
          python3 theshy_opgg_monitor.py --once --verbose

      - name: Check for changes
        id: check_changes
        if: ${{ !github.event.inputs.force_notify }}
        run: |
          changed=0
          # 保存改动前的data文件哈希用于比较
          for f in .theshy_data.json .theshy_events.json .theshy_profile.json .theshy_matches.json .theshy_match_reminders.json .theshy_bilibili_state.json .theshy_streak_state.json .theshy_hupu_ratings.json index.html; do
            if [ -f "$f" ]; then
              if git diff --quiet -- "$f" 2>/dev/null; then
                : # no change
              else
                changed=1
              fi
            fi
          done
          # 检查单账号状态文件
          for f in .theshy_state_*.json .theshy_matches_*.json; do
            for f2 in $f; do
              if [ -f "$f2" ]; then
                if ! git diff --quiet -- "$f2" 2>/dev/null; then
                  changed=1
                fi
              fi
            done
          done
          echo "should_deploy=$([ "$changed" = "1" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Commit state + events files
        if: ${{ !github.event.inputs.force_notify && steps.check_changes.outputs.should_deploy == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in .theshy_opgg_state.json .theshy_events.json .theshy_profile.json .theshy_matches.json .theshy_data.json .theshy_match_reminders.json .theshy_bilibili_state.json .theshy_streak_state.json .theshy_hupu_ratings.json index.html .theshy_state_*.json .theshy_matches_*.json; do
            for f2 in $f; do
              if [ -f "$f2" ]; then
                git add "$f2"
              fi
            done
          done
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update theshy state (multi-account + bilibili + streak)"
            git pull --rebase origin main || true
            git push || echo "push 失败, 下次 cron 会重试"
            echo "State committed"
          fi

      - name: Build (inline data for fast load)
        if: ${{ !github.event.inputs.force_notify && steps.check_changes.outputs.should_deploy == 'true' }}
        run: |
          # 构建：内联最新数据到HTML实现首屏秒开
          python3 build.py

      - name: Upload site artifact
        if: ${{ !github.event.inputs.force_notify && steps.check_changes.outputs.should_deploy == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: monitor
    if: ${{ !github.event.inputs.force_notify && needs.monitor.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
