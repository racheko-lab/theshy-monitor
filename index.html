<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TheShy 监控</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  /* 移动端深色主题 */
  --bg: #0d0f14;
  --bg-card: #161b26;
  --bg-card-2: #1c2230;
  --bg-elevated: #242b3d;
  --border: #252d40;
  --border-light: #2d3650;
  
  --text-primary: #ffffff;
  --text-secondary: #9ca8c4;
  --text-tertiary: #626d88;
  --text-muted: #454e66;
  
  --brand: #4a7dff;
  --brand-dim: rgba(74, 125, 255, 0.15);
  --brand-glow: rgba(74, 125, 255, 0.3);
  
  --win: #3b8eff;
  --win-bg: rgba(59, 142, 255, 0.12);
  --lose: #ff4d6a;
  --lose-bg: rgba(255, 77, 106, 0.1);
  
  --gold: #ffc107;
  --orange: #ff8c42;
  --purple: #b066ff;
  --green: #34d399;
  --cyan: #22d3ee;
  
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  
  --font-sans: -apple-system, BlinkMacSystemFont, 'Inter', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
}

html, body {
  font-family: var(--font-sans);
  background: #000;
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
  width: 100%;
  overflow-x: hidden;
}

body {
  background: var(--bg);
  padding-bottom: calc(68px + var(--safe-bottom));
  min-height: 100vh;
  position: relative;
}

/* 移动端容器 - 居中限制最大宽度 */
.app-container {
  max-width: 480px;
  margin: 0 auto;
  position: relative;
}

/* ========== 顶部导航栏 ========== */
.top-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(13, 15, 20, 0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding-top: var(--safe-top);
}
.top-nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  height: 52px;
}
.top-nav-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-dot {
  width: 8px;
  height: 8px;
  background: var(--green);
  border-radius: 50%;
  animation: pulse-green 2s infinite;
}
@keyframes pulse-green {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.4); }
  50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); }
}
.top-nav-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--bg-card);
  color: var(--text-secondary);
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
}
.icon-btn:active { background: var(--bg-elevated); transform: scale(0.92); }
.last-update {
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

/* ========== 内容区域 ========== */
.page-content {
  padding: 12px 12px 20px;
}

.tab-page { display: none; }
.tab-page.active { display: block; animation: pageFadeIn 0.2s ease; }
@keyframes pageFadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== 召唤师头部卡片 ========== */
.profile-card {
  background: linear-gradient(180deg, #1a2340 0%, var(--bg-card) 100%);
  border-radius: var(--radius-lg);
  padding: 20px 18px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
.profile-card::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 120px;
  height: 120px;
  background: radial-gradient(circle, rgba(74, 125, 255, 0.15) 0%, transparent 70%);
  pointer-events: none;
}

.profile-top {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}
.avatar-wrap {
  position: relative;
  flex-shrink: 0;
}
.avatar {
  width: 64px;
  height: 64px;
  border-radius: var(--radius);
  border: 2px solid var(--brand);
  object-fit: cover;
  background: var(--bg-elevated);
}
.status-ring {
  position: absolute;
  bottom: -2px;
  right: -2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 3px solid var(--bg-card);
}
.status-ring.online { background: var(--green); }
.status-ring.offline { background: var(--text-muted); }
.status-ring.unknown { background: var(--gold); }

.profile-info { flex: 1; min-width: 0; }
.profile-name {
  font-size: 20px;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.profile-status {
  font-size: 12px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
}

/* 段位信息 */
.ranked-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: rgba(0,0,0,0.2);
  border-radius: var(--radius);
  margin-bottom: 12px;
}
.tier-badge {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, #b066ff 0%, #8b5cf6 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 13px;
  color: white;
  flex-shrink: 0;
}
.tier-text {
  flex: 1;
}
.tier-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
}
.tier-lp {
  font-size: 12px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
}
.wr-mini {
  text-align: center;
}
.wr-num {
  font-size: 18px;
  font-weight: 700;
  color: var(--win);
  font-family: var(--font-mono);
}
.wr-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
}

/* 账号切换 */
.account-chips {
  display: flex;
  gap: 8px;
}
.acct-chip {
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.03);
  color: var(--text-tertiary);
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.acct-chip:active { transform: scale(0.95); }
.acct-chip.active {
  background: var(--brand-dim);
  border-color: var(--brand-glow);
  color: var(--brand);
}
.acct-chip .live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
}

/* ========== 直播横幅 ========== */
.live-banner {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: linear-gradient(135deg, rgba(255,77,106,0.15) 0%, rgba(255,140,66,0.1) 100%);
  border: 1px solid rgba(255,77,106,0.3);
  border-radius: var(--radius);
  margin-bottom: 12px;
  animation: slideDown 0.3s ease;
}
.live-banner.show { display: flex; }
.live-tag {
  padding: 4px 8px;
  background: var(--lose);
  color: white;
  font-size: 10px;
  font-weight: 700;
  border-radius: 4px;
  letter-spacing: 0.05em;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 4px;
}
.live-tag .dot {
  width: 5px;
  height: 5px;
  background: white;
  border-radius: 50%;
  animation: pulse-dot 1s infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
.live-banner-text {
  flex: 1;
  min-width: 0;
}
.live-banner-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.live-banner-meta {
  font-size: 11px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  margin-top: 2px;
}
.live-watch {
  padding: 6px 12px;
  background: var(--lose);
  color: white;
  text-decoration: none;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  flex-shrink: 0;
}

/* ========== 数据概览卡片 ========== */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 10px;
  text-align: center;
}
.stat-val {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}
.stat-val.win { color: var(--win); }
.stat-val.lose { color: var(--lose); }
.stat-val.gold { color: var(--gold); }
.stat-label {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 4px;
  font-weight: 500;
}

/* ========== 区块标题 ========== */
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 20px 4px 10px;
}
.section-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title-bar {
  width: 3px;
  height: 14px;
  background: var(--brand);
  border-radius: 2px;
}
.section-action {
  font-size: 12px;
  color: var(--brand);
  font-weight: 500;
  cursor: pointer;
}

/* ========== 比赛卡片 - 移动端优化 ========== */
.match-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.match-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
}
.match-card.win { border-left: 3px solid var(--win); }
.match-card.lose { border-left: 3px solid var(--lose); }
.match-card:active { background: var(--bg-card-2); }

.match-main {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 8px;
}
.match-result {
  width: 36px;
  flex-shrink: 0;
  text-align: center;
}
.match-result-text {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.02em;
}
.match-card.win .match-result-text { color: var(--win); }
.match-card.lose .match-result-text { color: var(--lose); }
.match-game-type {
  font-size: 9px;
  color: var(--text-muted);
  margin-top: 2px;
}
.match-time {
  font-size: 10px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  margin-top: 2px;
}

.match-champ {
  position: relative;
  flex-shrink: 0;
}
.champ-icon {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-sm);
  border: 2px solid var(--border-light);
}
.champ-lvl {
  position: absolute;
  bottom: -3px;
  right: -3px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text-primary);
  font-size: 9px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 4px;
  font-family: var(--font-mono);
}

/* 召唤师技能+符文列 */
.match-spells {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex-shrink: 0;
  width: 24px;
}
.spell-rune {
  width: 22px;
  height: 22px;
  border-radius: 4px;
  border: 1px solid var(--border);
  display: block;
  object-fit: cover;
}

.match-kda {
  flex-shrink: 0;
  width: 70px;
  text-align: center;
}
.match-badges {
  display: flex;
  gap: 3px;
  justify-content: center;
  margin-bottom: 2px;
}
.badge {
  font-size: 8px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 3px;
}
.badge-mvp { background: var(--gold); color: #000; }
.badge-svp { background: var(--purple); color: white; }
.badge-ace { background: var(--lose); color: white; }
.kda-line {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.kda-k { color: var(--text-primary); }
.kda-d { color: var(--lose); }
.kda-a { color: var(--cyan); }
.kda-sep { color: var(--text-muted); font-weight: 400; margin: 0 1px; }
.kda-ratio {
  font-size: 10px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
}

.match-items {
  display: flex;
  gap: 2px;
  flex-shrink: 0;
}
.item-slot {
  width: 22px;
  height: 22px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: var(--bg);
}
.item-slot.empty { opacity: 0.25; border-style: dashed; }

.match-meta {
  flex-shrink: 0;
  text-align: right;
  font-size: 11px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  width: 42px;
}

/* 比赛详情 */
.match-detail {
  display: none;
  border-top: 1px solid var(--border);
  background: rgba(0,0,0,0.2);
  padding: 10px 12px;
}
.match-detail.show { display: block; }
.detail-team-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 6px;
  margin-bottom: 4px;
}
.detail-team-header.win { background: var(--win-bg); color: var(--win); }
.detail-team-header.lose { background: var(--lose-bg); color: var(--lose); }
.detail-kda { font-family: var(--font-mono); margin-left: auto; font-weight: 600; }
.detail-player {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px;
  font-size: 11px;
}
.detail-player.me { color: var(--brand); font-weight: 600; }
.detail-player-champ {
  width: 16px;
  height: 16px;
  border-radius: 2px;
}
.detail-player-name {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text-secondary);
}
.detail-player.me .detail-player-name { color: var(--brand); }
.detail-player-kda {
  font-family: var(--font-mono);
  color: var(--text-tertiary);
  font-size: 10px;
}
.detail-items-mini {
  display: flex;
  gap: 1px;
}
.detail-items-mini .item-slot {
  width: 18px;
  height: 18px;
}

/* ========== 英雄统计 ========== */
.champ-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.champ-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 10px;
  background: var(--bg-card);
  padding: 4px;
  border-radius: var(--radius-sm);
}
.champ-tab {
  flex: 1;
  padding: 7px;
  text-align: center;
  font-size: 12px;
  font-weight: 500;
  border-radius: 5px;
  color: var(--text-tertiary);
  cursor: pointer;
  transition: all 0.15s;
}
.champ-tab.active {
  background: var(--bg-elevated);
  color: var(--brand);
  font-weight: 600;
}

.champ-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  margin-bottom: 4px;
}
.champ-sm-icon {
  width: 36px;
  height: 36px;
  border-radius: 6px;
  border: 1px solid var(--border);
}
.champ-info {
  flex: 1;
  min-width: 0;
}
.champ-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}
.champ-stats {
  display: flex;
  gap: 12px;
  font-size: 11px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  margin-top: 2px;
}
.champ-plays {
  text-align: right;
  font-family: var(--font-mono);
}
.champ-wr-num {
  font-size: 14px;
  font-weight: 700;
}
.champ-wr-num.win { color: var(--win); }
.champ-wr-num.lose { color: var(--lose); }
.champ-plays-text {
  font-size: 10px;
  color: var(--text-muted);
}
.wr-bar {
  width: 50px;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 4px;
  overflow: hidden;
}
.wr-bar-fill {
  height: 100%;
  border-radius: 2px;
}

/* ========== 虎扑评分 ========== */
.hupu-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
}
.hupu-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.hupu-logo {
  background: var(--gold);
  color: #000;
  font-weight: 800;
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 4px;
}
.hupu-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.hupu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: rgba(0,0,0,0.2);
  border-radius: var(--radius-sm);
}
.hupu-item:active { background: rgba(255,255,255,0.05); }
.hupu-score {
  background: var(--gold);
  color: #000;
  font-weight: 800;
  font-size: 14px;
  padding: 5px 10px;
  border-radius: 6px;
  min-width: 36px;
  text-align: center;
  font-family: var(--font-mono);
}
.hupu-score.pending {
  background: var(--bg-elevated);
  color: var(--text-tertiary);
  font-size: 10px;
  font-weight: 600;
}
.hupu-title {
  flex: 1;
  font-size: 12px;
  color: var(--text-secondary);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hupu-title a { color: inherit; text-decoration: none; }
.hupu-time {
  font-size: 10px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  flex-shrink: 0;
}

/* ========== 事件/动态时间线 ========== */
.filter-chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 12px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-chips::-webkit-scrollbar { display: none; }
.filter-chip {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-tertiary);
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.15s;
  flex-shrink: 0;
}
.filter-chip.active {
  background: var(--brand-dim);
  border-color: var(--brand-glow);
  color: var(--brand);
}

.event-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.event-item {
  display: flex;
  gap: 12px;
  padding: 12px 14px;
  background: var(--bg-card);
  border-radius: var(--radius);
  border-left: 3px solid transparent;
}
.event-item.win { border-left-color: var(--win); }
.event-item.lose { border-left-color: var(--lose); }
.event-item.rank { border-left-color: var(--gold); }
.event-item.streak { border-left-color: var(--orange); }
.event-item.esports { border-left-color: var(--purple); }
.event-item.live { border-left-color: var(--lose); }

.event-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg-elevated);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.event-body { flex: 1; min-width: 0; }
.event-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  line-height: 1.4;
}
.event-meta {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
  font-family: var(--font-mono);
}
.event-acct {
  display: inline-block;
  background: var(--bg-elevated);
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 9px;
  margin-right: 4px;
  color: var(--text-tertiary);
}

/* ========== 底部Tab栏 ========== */
.bottom-tabs {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: rgba(13, 15, 20, 0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  padding-bottom: var(--safe-bottom);
  display: flex;
  justify-content: center;
}
.bottom-tabs-inner {
  width: 100%;
  max-width: 480px;
  display: flex;
}
.bottom-tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 0 6px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
  -webkit-user-select: none;
  user-select: none;
}
.bottom-tab:active { transform: scale(0.92); }
.bottom-tab-icon {
  font-size: 20px;
  margin-bottom: 2px;
  position: relative;
}
.bottom-tab-label {
  font-size: 10px;
  font-weight: 500;
  color: var(--text-muted);
}
.bottom-tab.active .bottom-tab-label { color: var(--brand); font-weight: 600; }
.bottom-tab.active .bottom-tab-icon { transform: scale(1.1); }
.bottom-tab-dot {
  position: absolute;
  top: 4px;
  right: calc(50% - 14px);
  width: 8px;
  height: 8px;
  background: var(--lose);
  border-radius: 50%;
  border: 2px solid var(--bg);
}
.bottom-tab-badge {
  position: absolute;
  top: 2px;
  right: calc(50% - 20px);
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  background: var(--lose);
  border-radius: 8px;
  color: white;
  font-size: 9px;
  font-weight: 700;
  font-family: var(--font-mono);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ========== 空状态 ========== */
.empty-state {
  padding: 40px 20px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}

/* ========== 折叠面板 ========== */
details {
  margin-top: 16px;
}
summary {
  cursor: pointer;
  list-style: none;
  padding: 12px 4px;
  color: var(--text-tertiary);
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
summary::-webkit-details-marker { display: none; }
summary::after {
  content: '›';
  font-size: 18px;
  color: var(--text-muted);
  margin-left: auto;
  transition: transform 0.2s;
}
details[open] summary::after { transform: rotate(90deg); }
.seasons-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding-bottom: 8px;
}
.season-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
}
.season-num {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 13px;
  color: var(--text-primary);
  margin-bottom: 6px;
}
.kv-line {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  padding: 2px 0;
}
.kv-k { color: var(--text-muted); }
.kv-v { color: var(--text-secondary); font-family: var(--font-mono); }

/* ========== 下拉刷新提示 ========== */
.pull-refresh {
  text-align: center;
  padding: 12px;
  color: var(--text-muted);
  font-size: 12px;
  display: none;
}
.pull-refresh.show { display: block; }

/* ========== 加载动画 ========== */
.spinner {
  width: 20px;
  height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 0 auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-state {
  padding: 30px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}

/* ========== Toast ========== */
.toast {
  position: fixed;
  top: calc(60px + var(--safe-top));
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: var(--bg-elevated);
  color: var(--text-primary);
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  z-index: 200;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  border: 1px solid var(--border);
  max-width: calc(480px - 40px);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>

<script>
// ============================================================
// 配置
// ============================================================
const params = new URLSearchParams(location.search);
const REPO = params.get('repo') || 'racheko-lab/theshy-monitor';
const RAW = './';
const FILES = {
  data:    RAW + '.theshy_data.json',
  state:   RAW + '.theshy_opgg_state.json',
  events:  RAW + '.theshy_events.json',
  profile: RAW + '.theshy_profile.json',
  matches: RAW + '.theshy_matches.json',
};
const API_BASE = `https://api.github.com/repos/${REPO}/`;

const TIER_NAMES = {
  CHALLENGER: '王者', GRANDMASTER: '宗师', MASTER: '大师',
  DIAMOND: '钻石', EMERALD: '翡翠', PLATINUM: '铂金',
  GOLD: '黄金', SILVER: '白银', BRONZE: '青铜', IRON: '黑铁',
};
const TIER_SHORT = {
  CHALLENGER: 'C', GRANDMASTER: 'GM', MASTER: 'M',
  DIAMOND: 'D', EMERALD: 'E', PLATINUM: 'P',
  GOLD: 'G', SILVER: 'S', BRONZE: 'B', IRON: 'I',
};
const DIVISION_NAMES = { 1: 'I', 2: 'II', 3: 'III', 4: 'IV' };
const GAME_TYPES = {
  SOLORANKED: '单双排', FLEXRANKED: '灵活组排', ARENA: '竞技场',
  NORMAL: '匹配', ARAM: '大乱斗', RANKED: '排位', BOT: '人机',
};

const DD_VER = '16.14.1';
const CD_DD = `https://ddragon.leagueoflegends.com/cdn/${DD_VER}`;
const CD_CD = 'https://cdn.communitydragon.org/latest';
const CD_OPGG = 'https://opgg-static.akamaized.net/images/lol';

const IMG_ERR = "this.style.opacity=0.3;this.onerror=null;";
const champIcon = id => id ? `${CD_CD}/champion/${id}/square` : '';
const itemIcon = id => id ? `${CD_DD}/img/item/${id}.png` : '';
const perkIcon = id => id ? `${CD_OPGG}/perk/${id}.png` : '';
const perkStyleIcon = id => id ? `${CD_OPGG}/perkStyle/${id}.png` : '';

function runeHtml(rune) {
  if (!rune) return '';
  let p = '';
  if (rune.primary_rune_id) {
    const pri = perkIcon(rune.primary_rune_id);
    const fb = rune.primary_page_id ? perkStyleIcon(rune.primary_page_id) : '';
    if (fb) {
      p = `<img class="spell-rune" src="${pri}" onerror="this.onerror=null;this.src='${fb}';this.style.opacity=0.3;">`;
    } else {
      p = `<img class="spell-rune" src="${pri}" onerror="${IMG_ERR}">`;
    }
  } else if (rune.primary_page_id) {
    p = `<img class="spell-rune" src="${perkStyleIcon(rune.primary_page_id)}" onerror="${IMG_ERR}">`;
  }
  if (rune.secondary_page_id && p) {
    p += `<img class="spell-rune" src="${perkStyleIcon(rune.secondary_page_id)}" onerror="${IMG_ERR}">`;
  }
  return p;
}

const SUMMONER_SPELL_FILES = {
  1:'SummonerBoost', 3:'SummonerExhaust', 4:'SummonerFlash', 6:'SummonerHaste',
  7:'SummonerHeal', 11:'SummonerSmite', 12:'SummonerTeleport', 14:'SummonerDot',
  21:'SummonerBarrier', 13:'SummonerMana'
};
const spellIcon = id => {
  const f = SUMMONER_SPELL_FILES[id];
  return f ? `${CD_OPGG}/spell/${f}.png` : '';
};

function calcKda(k,d,a) {
  k=+k||0; d=+d||0; a=+a||0;
  if (d===0) return k+a>0?'Perfect':'0.00';
  return ((k+a)/d).toFixed(2);
}

function fmtKstTime(iso) {
  if (!iso) return '--:--';
  try {
    const d = new Date(iso);
    return d.toLocaleTimeString('zh-CN', { timeZone:'Asia/Seoul', hour:'2-digit', minute:'2-digit' });
  } catch { return '--:--'; }
}

function ageStr(iso) {
  if (!iso) return '';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return `${Math.floor(s)}秒前`;
  if (s < 3600) return `${Math.floor(s/60)}分钟前`;
  if (s < 86400) return `${Math.floor(s/3600)}小时前`;
  return `${Math.floor(s/86400)}天前`;
}

function isMe(p) {
  if (!p) return false;
  const a = currentData?.account;
  if (a) return p.summoner_name === a.game_name && p.summoner_tag === a.tag_line;
  return p.summoner_name === 'The shy' && p.summoner_tag === 'asdf';
}

function multiKillBadge(n) {
  if (!n || n < 2) return '';
  const l = {2:'双杀',3:'三杀',4:'四杀',5:'五杀'};
  return `<span class="badge badge-ace">${l[n]||n+'杀'}</span>`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ============================================================
// 数据获取
// ============================================================
async function fetchJson(url) {
  const r = await fetch(`${url}?t=${Date.now()}`, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${r.status}`);
  return r.json();
}

let allData = null;
let currentSlug = null;
let currentData = { state:null, events:[], profile:null, matches:[], account:null };
let eventFilter = 'all';
let champTabIdx = 0;

function selectAccount(slug) {
  if (!allData?.accounts) return;
  const acct = allData.accounts.find(a => a.slug === slug) || allData.accounts[0];
  if (!acct) return;
  currentSlug = acct.slug;
  currentData = {
    state: { profile: acct.profile, is_active: acct.state?.is_active, last_check: acct.state?.last_check },
    events: allData.events || [],
    profile: acct.profile,
    matches: acct.matches || [],
    account: acct,
  };
  renderAccountChips();
  renderAll();
}

function renderAccountChips() {
  const c = document.getElementById('account-chips');
  if (!allData?.accounts || allData.accounts.length <= 1) {
    c.innerHTML = ''; c.style.display = 'none'; return;
  }
  c.style.display = '';
  c.innerHTML = allData.accounts.map(a => `
    <div class="acct-chip${a.slug===currentSlug?' active':''}" data-slug="${a.slug}">
      ${a.state?.is_active ? '<span class="live-dot"></span>' : ''}
      <span>${a.label}</span>
    </div>
  `).join('');
  c.querySelectorAll('.acct-chip').forEach(el => {
    el.addEventListener('click', () => selectAccount(el.dataset.slug));
  });
}

async function refresh() {
  const btn = document.getElementById('refresh-btn');
  btn.style.transform = 'rotate(360deg)';
  btn.style.transition = 'transform 0.5s';
  try {
    let data = null;
    try { data = await fetchJson(FILES.data); } catch(e) {}

    if (data?.accounts?.length) {
      const events = await fetchJson(FILES.events).catch(() => []);
      allData = { ...data, events: events||[] };
      let target = currentSlug;
      if (!target || !allData.accounts.find(a=>a.slug===target)) {
        const live = allData.accounts.find(a=>a.state?.is_active);
        target = live ? live.slug : allData.accounts[0].slug;
      }
      selectAccount(target);
    } else {
      const [state, events, profile, matches] = await Promise.all([
        fetchJson(FILES.state).catch(()=>null),
        fetchJson(FILES.events).catch(()=>[]),
        fetchJson(FILES.profile).catch(()=>null),
        fetchJson(FILES.matches).catch(()=>[]),
      ]);
      allData = null;
      currentSlug = 'main';
      currentData = { state, events: events||[], profile, matches: matches||[], account:null };
      renderAccountChips();
      renderAll();
    }
    const now = new Date();
    document.getElementById('last-update').textContent = 
      `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    showToast('已刷新');
  } catch(e) {
    showToast('刷新失败');
  }
  setTimeout(() => { btn.style.transform = ''; btn.style.transition = ''; }, 500);
}

// ============================================================
// 渲染函数
// ============================================================
function deriveStatus(state, profile) {
  const updated = profile?.updated_at || state?.profile?.updated_at;
  if (!updated) return { level:'offline', text:'暂无数据' };
  const s = (Date.now() - new Date(updated).getTime()) / 1000;
  if (s < 300) return { level:'online', text:`游戏中 · ${Math.floor(s)}秒前` };
  if (s < 1800) return { level:'unknown', text:`${ageStr(updated)}更新` };
  return { level:'offline', text:`离线 · ${ageStr(updated)}` };
}

function renderProfile() {
  const { state, profile } = currentData;
  const p = profile || state?.profile || {};

  if (p.profile_image_url) {
    document.getElementById('avatar').src = p.profile_image_url;
  }
  document.getElementById('profile-name').textContent = p.game_name || p.name || currentData.account?.game_name || 'TheShy';

  const st = deriveStatus(state, profile);
  document.getElementById('status-ring').className = `status-ring ${st.level}`;
  document.getElementById('profile-status').textContent = st.text;

  const row = document.getElementById('ranked-row');
  const ls = (p.league_stats||[]).filter(l => l.game_type !== 'ARENA');

  if (ls.length) {
    const l = ls[0];
    const tierName = TIER_NAMES[l.tier] || '';
    const divName = l.division ? DIVISION_NAMES[l.division] : '';
    const play = l.play || (l.match_win||0)+(l.match_lose||0);
    const wins = l.match_win ?? l.win ?? 0;
    const losses = l.match_lose ?? l.lose ?? 0;
    const wr = play ? (wins/play*100).toFixed(0) : 0;
    const tierShort = TIER_SHORT[l.tier] || (tierName ? tierName.charAt(0) : '?');

    let rankHtml = '';
    if (p.ladder_rank?.rank) {
      const rk = p.ladder_rank.rank;
      rankHtml = `<div style="text-align:center;"><div style="font-size:16px;font-weight:700;color:var(--gold);font-family:var(--font-mono);">#${rk>=10000?(rk/10000).toFixed(1)+'w':rk.toLocaleString()}</div><div style="font-size:10px;color:var(--text-muted);">排名</div></div>`;
    }

    row.innerHTML = `
      <div class="tier-badge">${tierShort}</div>
      <div class="tier-text">
        <div class="tier-name">${tierName} ${divName}</div>
        <div class="tier-lp">${l.lp??0} LP · ${wins}W ${losses}L</div>
      </div>
      <div class="wr-mini">
        <div class="wr-num">${wr}%</div>
        <div class="wr-label">胜率</div>
      </div>
      ${rankHtml}
    `;
  } else {
    row.innerHTML = '<div style="color:var(--text-muted);font-size:13px;">未定级</div>';
  }
}

function renderLiveBanners() {
  const banners = [
    { b:'live-banner', tag:'live-tag', title:'live-title', meta:'live-meta', cta:'live-watch' },
    { b:'live-banner-esports', tag:'live-tag-esports', title:'live-title-esports', meta:'live-meta-esports', cta:'live-watch-esports' }
  ];

  const bili = allData?.bilibili;
  if (!bili) {
    banners.forEach(x => document.getElementById(x.b)?.classList.remove('show'));
    updateTabBadges();
    return;
  }

  const isLive = bili.is_ig_live || bili.is_live;
  banners.forEach(x => {
    const el = document.getElementById(x.b);
    if (!el) return;
    const tagEl = document.getElementById(x.tag);
    const titleEl = document.getElementById(x.title);
    const metaEl = document.getElementById(x.meta);
    const ctaEl = document.getElementById(x.cta);

    if (isLive) {
      el.classList.add('show');
      if (tagEl) tagEl.style.display = '';
      if (ctaEl) ctaEl.style.display = '';
      titleEl.textContent = bili.title || 'B站LPL直播中';
      metaEl.textContent = bili.is_ig_live ? '🔴 IG比赛直播中!' : 'B站直播中';
    } else {
      if (bili.title && bili.last_check) {
        el.classList.add('show');
        if (tagEl) tagEl.style.display = 'none';
        if (ctaEl) ctaEl.style.display = 'none';
        titleEl.textContent = 'B站LPL直播间';
        metaEl.textContent = bili.title;
      } else {
        el.classList.remove('show');
      }
    }
  });
  updateTabBadges();
}

function renderStats() {
  const { matches } = currentData;
  const row = document.getElementById('stats-row');
  if (!matches?.length) { row.innerHTML = ''; return; }

  const recent = matches.slice(0, 20);
  const wins = recent.filter(m => m.result === 'WIN').length;
  const wr = recent.length ? Math.round(wins/recent.length*100) : 0;

  let streak = 0, streakType = null;
  for (const m of matches) {
    if (!streakType) { streakType = m.result; streak = 1; }
    else if (m.result === streakType) streak++;
    else break;
  }

  const todayStats = allData?.daily_stats?.[currentSlug];
  let cards = [];
  if (todayStats?.today_matches) {
    cards.push({ val: todayStats.today_matches, label: '今日', cls: '' });
  }
  cards.push({ val: `${wr}%`, label: `近${recent.length}场胜率`, cls: wins>=recent.length-wins?'win':'lose' });
  cards.push({
    val: streak,
    label: streakType==='WIN'?'🔥连胜':'💔连败',
    cls: streakType==='WIN'?'win':'lose'
  });

  let tK=0,tD=0,tA=0;
  recent.forEach(m=>{tK+=m.kill||0;tD+=m.death||0;tA+=m.assist||0;});
  const avgKda = tD===0?'P':((tK+tA)/tD).toFixed(1);
  cards.push({ val: avgKda, label: '平均KDA', cls: 'gold' });

  // 只显示前3-4个
  cards = cards.slice(0, 3);
  row.innerHTML = cards.map(c =>
    `<div class="stat-card"><div class="stat-val ${c.cls}">${c.val}</div><div class="stat-label">${c.label}</div></div>`
  ).join('');
}

function buildMatchCard(m, idx, expandable) {
  const win = m.result === 'WIN';
  const sec = m.game_length_second || 0;
  const min = Math.floor(sec/60);
  const time = fmtKstTime(m.created_at);
  const isMvp = m.op_score_rank === 1;
  const isSvp = m.op_score_rank === 2;
  let badge = '';
  if (isMvp) badge = '<span class="badge badge-mvp">MVP</span>';
  else if (isSvp) badge = '<span class="badge badge-svp">SVP</span>';
  const mk = multiKillBadge(m.largest_multi_kill);

  // 移动端紧凑：只显示5个装备（省空间）
  const items = (m.items||[]).slice(0,5);
  while (items.length < 5) items.push(0);
  const itemsHtml = items.map(iid =>
    iid ? `<img class="item-slot" src="${itemIcon(iid)}" onerror="${IMG_ERR}">`
        : '<span class="item-slot empty"></span>'
  ).join('');

  // 召唤师技能（2个）+ 主符文（1个），总共3个小图标
  const spells = (m.spells||[]).slice(0,2);
  let spellsHtml = spells.map(s => `<img class="spell-rune" src="${spellIcon(s)}" onerror="${IMG_ERR}">`).join('');
  // 只取主符文（第一个img）
  const runeImgs = runeHtml(m.rune).match(/<img[^>]*>/g);
  if (runeImgs && runeImgs.length > 0) {
    // 给主符文加上spell-rune class（替换掉可能的其他class）
    const mainRune = runeImgs[0].replace(/class="[^"]*"/, 'class="spell-rune"').replace(/style="[^"]*"/g, '');
    spellsHtml += mainRune;
  }

  const kda = calcKda(m.kill, m.death, m.assist);

  return `
    <div class="match-card ${win?'win':'lose'}" data-idx="${idx}">
      <div class="match-main">
        <div class="match-result">
          <div class="match-result-text">${win?'胜':'负'}</div>
          <div class="match-game-type">${GAME_TYPES[m.game_type]||''}</div>
          <div class="match-time">${time}</div>
        </div>
        <div class="match-champ">
          <img class="champ-icon" src="${champIcon(m.champion_id)}" onerror="${IMG_ERR}">
          ${m.champion_level ? `<span class="champ-lvl">${m.champion_level}</span>` : ''}
        </div>
        <div class="match-spells">
          ${spellsHtml}
        </div>
        <div class="match-kda">
          <div class="match-badges">${badge}${mk}</div>
          <div class="kda-line">
            <span class="kda-k">${m.kill||0}</span><span class="kda-sep">/</span><span class="kda-d">${m.death||0}</span><span class="kda-sep">/</span><span class="kda-a">${m.assist||0}</span>
          </div>
          <div class="kda-ratio">${kda} KDA</div>
        </div>
        <div class="match-items">${itemsHtml}</div>
        <div class="match-meta">
          <div>${min}分</div>
          ${expandable?'<div style="font-size:9px;margin-top:2px;opacity:0.6;">▼</div>':''}
        </div>
      </div>
      ${expandable ? `<div class="match-detail" data-detail="${idx}">${renderMatchDetail(m)}</div>` : ''}
    </div>
  `;
}

function renderMatchDetail(m) {
  const parts = m.participants || [];
  if (!parts.length) return '<div class="empty-state">无详情</div>';
  const blue = parts.filter(p => p.team_key === 'BLUE');
  const red = parts.filter(p => p.team_key === 'RED');

  function teamKda(t) { let k=0,d=0,a=0; t.forEach(p=>{k+=p.kill||0;d+=p.death||0;a+=p.assist||0;}); return {k,d,a}; }
  const bk = teamKda(blue), rk = teamKda(red);
  const blueWin = blue[0]?.result === 'WIN';
  const redWin = red[0]?.result === 'WIN';

  function pRow(p) {
    const me = isMe(p);
    const pItems = (p.items||[]).slice(0,6).map(iid =>
      iid ? `<img class="item-slot" src="${itemIcon(iid)}" onerror="${IMG_ERR}">`
          : '<span class="item-slot empty"></span>'
    ).join('');
    return `<div class="detail-player ${me?'me':''}">
      <img class="detail-player-champ" src="${champIcon(p.champion_id)}" onerror="${IMG_ERR}">
      <span class="detail-player-name">${p.summoner_name||'?'}</span>
      <span class="detail-player-kda">${p.kill||0}/${p.death||0}/${p.assist||0}</span>
      <span class="detail-items-mini">${pItems}</span>
    </div>`;
  }

  return `
    <div class="detail-team-header ${blueWin?'win':'lose'}">
      <span>蓝方 ${blueWin?'胜':'负'}</span>
      <span class="detail-kda">${bk.k}/${bk.d}/${bk.a}</span>
    </div>
    ${blue.map(pRow).join('')}
    <div class="detail-team-header ${redWin?'win':'lose'}">
      <span>红方 ${redWin?'胜':'负'}</span>
      <span class="detail-kda">${rk.k}/${rk.d}/${rk.a}</span>
    </div>
    ${red.map(pRow).join('')}
  `;
}

function renderMatches() {
  const { matches } = currentData;
  // 最近5场
  const recent = document.getElementById('matches-recent');
  if (recent) {
    if (!matches?.length) {
      recent.innerHTML = '<div class="empty-state">暂无比赛</div>';
    } else {
      recent.innerHTML = matches.slice(0,5).map((m,i) => buildMatchCard(m,i,false)).join('');
    }
  }
  // 全部
  const all = document.getElementById('matches-all');
  if (all) {
    if (!matches?.length) {
      all.innerHTML = '<div class="empty-state">暂无比赛记录</div>';
    } else {
      all.innerHTML = matches.map((m,i) => buildMatchCard(m,i,true)).join('');
      all.querySelectorAll('.match-card').forEach(card => {
        card.addEventListener('click', () => {
          const d = card.querySelector('.match-detail');
          if (!d) return;
          const open = d.classList.contains('show');
          d.classList.toggle('show', !open);
        });
      });
    }
  }
}

let champData = null;
function renderChampTabs() {
  const { profile } = currentData;
  const tabs = [];
  if (profile?.most_champions?.champion_stats?.length) {
    tabs.push({ key:'season', label:`赛季`, data:profile.most_champions, type:'season' });
  }
  if (profile?.ranked_most_champions?.my_champion_stats?.length) {
    tabs.push({ key:'ranked', label:`排位`, data:profile.ranked_most_champions, type:'ranked' });
  }
  champData = tabs;
  if (champTabIdx >= tabs.length) champTabIdx = 0;

  const topTabs = document.getElementById('champ-tabs-top');
  if (topTabs && tabs.length > 1) {
    topTabs.innerHTML = tabs.map((t,i) =>
      `<div class="champ-tab${i===champTabIdx?' active':''}" data-idx="${i}">${t.label}</div>`
    ).join('');
    topTabs.querySelectorAll('.champ-tab').forEach(t => {
      t.addEventListener('click', () => { champTabIdx = +t.dataset.idx; renderChampList(); });
    });
  } else if (topTabs) {
    topTabs.innerHTML = '';
  }
}

function renderChampList() {
  renderChampTabs();
  const list = document.getElementById('champ-list');
  if (!list) return;
  if (!champData?.length) { list.innerHTML = '<div class="empty-state">暂无英雄统计</div>'; return; }

  const tab = champData[champTabIdx] || champData[0];
  const stats = tab.type === 'season' ? tab.data.champion_stats : tab.data.my_champion_stats;

  list.innerHTML = stats.slice(0,20).map(c => {
    const wr = c.play ? ((c.win||0)/c.play*100) : 0;
    const kda = calcKda(c.kill, c.death, c.assist);
    const color = wr >= 50 ? 'var(--win)' : 'var(--lose)';
    return `<div class="champ-row">
      <img class="champ-sm-icon" src="${champIcon(c.champion_id)}" onerror="${IMG_ERR}">
      <div class="champ-info">
        <div class="champ-name">${c.champion_name||'?'}</div>
        <div class="champ-stats">
          <span>${c.play||0}场</span>
          <span>KDA ${kda}</span>
        </div>
      </div>
      <div class="champ-plays">
        <div class="champ-wr-num ${wr>=50?'win':'lose'}">${Math.round(wr)}%</div>
        <div class="wr-bar"><div class="wr-bar-fill" style="width:${wr}%;background:${color};"></div></div>
      </div>
    </div>`;
  }).join('');
}

function buildEvent(ev) {
  let cls = 'event-item', icon = '📌', title = ev.type, meta = '';
  const acct = ev.account ? `<span class="event-acct">${ev.account}</span>` : '';

  if (ev.type === 'became_active' || ev.type === 'opgg_updated') {
    cls += ' live'; icon = '🔥'; title = '开始排位';
    meta = `${acct}${ageStr(ev.updated_at)}`;
  } else if (ev.type === 'new_match') {
    cls += ev.result==='WIN'?' win':' lose';
    icon = ev.result==='WIN'?'🏆':'💔';
    title = `${GAME_TYPES[ev.game_type]||''} · ${ev.champion||''} · ${ev.result==='WIN'?'胜利':'失败'}`;
    meta = `${acct}${ev.kda||''} · ${fmtKstTime(ev.created_at)}`;
  } else if (ev.type === 'lp_changed' || ev.type === 'rank_changed') {
    cls += ' rank';
    icon = ev.delta >= 0 ? '📈' : '📉';
    title = ev.type === 'rank_changed' ? `段位: ${ev.old}→${ev.new}` : `LP ${ev.delta>=0?'+':''}${ev.delta}`;
    meta = acct + ageStr(ev.timestamp);
  } else if (ev.type === 'winning_streak' || ev.type === 'highlight') {
    cls += ' streak'; icon = '🔥';
    title = ev.type === 'winning_streak' ? `${ev.streak}连胜!` : `高光!${ev.is_mvp?' ⭐MVP':''}${ev.is_penta?' 💥五杀':''}`;
  } else if (ev.type === 'losing_streak') {
    cls += ' lose'; icon = '💔'; title = `${ev.streak}连败...`;
  } else if (ev.type === 'lpl_match') {
    cls += ' esports'; icon = '🏟️';
    title = ev.kind === 'pre' ? `即将: ${ev.team_a} vs ${ev.team_b}` :
            ev.kind === 'start' ? `开始: ${ev.team_a} vs ${ev.team_b}` :
            `${ev.team_a} vs ${ev.team_b}`;
    meta = ev.stage||'';
  } else if (ev.type === 'bilibili_live') {
    cls += ' live'; icon = '📺';
    title = ev.kind === 'ig_live_start' ? '🔴 IG比赛开播!' :
            ev.kind === 'ig_live_end' ? 'IG直播结束' : 'B站直播更新';
    meta = ev.title||'';
  } else if (ev.type === 'hupu_rating') {
    cls += ' esports'; icon = '⭐'; title = '虎扑评分已出'; meta = ev.title||'';
  } else if (ev.type === 'system_initialized') {
    icon = '🚀'; title = ev.msg || '监控启动';
  }

  return `<div class="${cls}">
    <div class="event-icon">${icon}</div>
    <div class="event-body">
      <div class="event-title">${title}</div>
      <div class="event-meta">${meta}</div>
    </div>
  </div>`;
}

function eventCat(ev) {
  const t = ev.type;
  if (t === 'new_match' || t === 'became_active') return 'match';
  if (t === 'lp_changed' || t === 'rank_changed') return 'rank';
  if (t === 'winning_streak' || t === 'losing_streak' || t === 'highlight') return 'streak';
  if (t === 'lpl_match' || t === 'bilibili_live' || t === 'hupu_rating') return 'esports';
  return 'other';
}

function renderEvents() {
  const events = currentData.events || [];

  // 全部（带筛选）
  const allEl = document.getElementById('events-all');
  if (allEl) {
    let filtered = events;
    if (eventFilter !== 'all') {
      filtered = events.filter(e => eventCat(e) === eventFilter);
    }
    allEl.innerHTML = filtered.length
      ? filtered.slice(0,100).map(buildEvent).join('')
      : '<div class="empty-state">暂无事件</div>';
  }

  // 赛事
  const esEl = document.getElementById('events-esports');
  if (esEl) {
    const es = events.filter(e => eventCat(e) === 'esports').slice(0,30);
    esEl.innerHTML = es.length ? es.map(buildEvent).join('') : '<div class="empty-state">暂无赛事动态</div>';
  }

  updateTabBadges();
}

function renderHupu() {
  const c = document.getElementById('hupu-container');
  if (!c) return;
  const hupu = allData?.hupu_ratings;
  const matches = hupu?.matches || [];

  if (!matches.length) {
    c.innerHTML = '<div class="hupu-card"><div class="empty-state">暂无IG比赛评分</div></div>';
    return;
  }

  function clean(t) { return t.replace(/^\[赛后\]\s*/, '').substring(0, 30); }
  function ago(iso) {
    if (!iso) return '';
    const m = Math.floor((Date.now()-new Date(iso).getTime())/60000);
    if (m<1) return '刚刚'; if (m<60) return `${m}分钟前`;
    const h = Math.floor(m/60); if (h<24) return `${h}小时前`;
    return `${Math.floor(h/24)}天前`;
  }

  c.innerHTML = `<div class="hupu-card">
    <div class="hupu-head">
      <span class="hupu-logo">虎扑</span>
      <span style="font-weight:600;color:var(--text-primary);font-size:13px;">${hupu.team||'LPL'}比赛评分</span>
    </div>
    <div class="hupu-list">
      ${matches.slice(0,8).map(m => `
        <a href="${m.url}" target="_blank" style="text-decoration:none;color:inherit;">
          <div class="hupu-item">
            ${m.score ? `<span class="hupu-score">${m.score}</span>` : '<span class="hupu-score pending">赛后</span>'}
            <div class="hupu-title">${clean(m.title)}</div>
            <span class="hupu-time">${ago(m.found_at)}</span>
          </div>
        </a>
      `).join('')}
    </div>
  </div>`;
  updateTabBadges();
}

function renderSeasons() {
  const { profile } = currentData;
  const c = document.getElementById('seasons-grid');
  if (!c || !profile) { c && (c.innerHTML = ''); return; }
  const prev = profile.previous_season_tiers || [];
  const seas = profile.previous_seasons || [];
  const all = {};
  for (const s of seas) all[s.season_id] = { tier:s.tier, division:s.division, lp:s.lp };
  for (const p of prev) {
    if (!all[p.season_id]) all[p.season_id] = {};
    all[p.season_id][p.game_type] = { tier:p.tier, division:p.division, win:p.win, lose:p.lose };
  }
  const ids = Object.keys(all).sort((a,b)=>b-a);
  if (!ids.length) { c.innerHTML = '<div class="empty-state">无历史</div>'; return; }
  c.innerHTML = ids.map(sid => {
    const s = all[sid];
    let rows = [];
    if (s.tier) rows.push(`<div class="kv-line"><span class="kv-k">最高</span><span class="kv-v" style="color:var(--gold);">${TIER_NAMES[s.tier]||s.tier} ${s.lp??0}LP</span></div>`);
    for (const gt of ['SOLORANKED','FLEXRANKED']) {
      if (s[gt]) rows.push(`<div class="kv-line"><span class="kv-k">${GAME_TYPES[gt]}</span><span class="kv-v">${TIER_NAMES[s[gt].tier]||s[gt].tier} · ${s[gt].win||0}W${s[gt].lose||0}L</span></div>`);
    }
    return `<div class="season-card"><div class="season-num">S${sid}</div>${rows.join('')}</div>`;
  }).join('');
}

function renderAll() {
  renderProfile();
  renderLiveBanners();
  renderStats();
  renderMatches();
  renderChampList();
  renderEvents();
  renderHupu();
  renderSeasons();
}

// ============================================================
// Tab切换
// ============================================================
const TAB_TITLES = { overview:'总览', matches:'战绩', esports:'赛事', activity:'动态' };

function switchTab(tabId) {
  document.querySelectorAll('.bottom-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tabId));
  document.querySelectorAll('.tab-page').forEach(p => p.classList.toggle('active', p.id === `page-${tabId}`));
  document.getElementById('nav-title').textContent = TAB_TITLES[tabId] || '';
  history.replaceState(null, '', `#${tabId}`);
  window.scrollTo({ top:0, behavior:'smooth' });
}

document.querySelectorAll('.bottom-tab').forEach(tab => {
  tab.addEventListener('click', () => switchTab(tab.dataset.tab));
});

if (location.hash) {
  const h = location.hash.slice(1);
  if (TAB_TITLES[h]) setTimeout(() => switchTab(h), 50);
}

function updateTabBadges() {
  const isLive = !!(allData?.bilibili && (allData.bilibili.is_live || allData.bilibili.is_ig_live));
  const dot = document.getElementById('tab-esports-dot');
  if (dot) dot.style.display = isLive ? 'block' : 'none';

  const events = currentData.events || [];
  const recent = events.filter(e => Date.now() - (e.ts||e.timestamp||0) < 3600000).length;
  const badge = document.getElementById('tab-activity-badge');
  if (badge) {
    if (recent > 0) {
      badge.style.display = 'flex';
      badge.textContent = recent > 9 ? '9+' : recent;
    } else {
      badge.style.display = 'none';
    }
  }
}

// 事件筛选
document.querySelectorAll('#filter-chips .filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#filter-chips .filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    eventFilter = chip.dataset.filter;
    renderEvents();
  });
});

// 刷新按钮
document.getElementById('refresh-btn').addEventListener('click', refresh);

// 自动刷新
let timer = null;
function startAuto(sec) {
  if (timer) clearInterval(timer);
  if (sec > 0) timer = setInterval(refresh, sec * 1000);
}
startAuto(60);

// 启动
refresh();

// 阻止双指缩放
document.addEventListener('gesturestart', e => e.preventDefault());
