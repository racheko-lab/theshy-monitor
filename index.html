<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TheShy 监控 v2026.08.01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  /* 移动端深色主题 */
  --bg: #0d0f14;
  --bg-card: #161b26;
  --bg-card-2: #1c2230;
  --bg-elevated: #242b3d;
  --border: #252d40;
  --border-light: #2d3650;
  
  --text-primary: #ffffff;
  --text-secondary: #9ca8c4;
  --text-tertiary: #626d88;
  --text-muted: #454e66;
  
  --brand: #4a7dff;
  --brand-dim: rgba(74, 125, 255, 0.15);
  --brand-glow: rgba(74, 125, 255, 0.3);
  
  --win: #3b8eff;
  --win-bg: rgba(59, 142, 255, 0.12);
  --lose: #ff4d6a;
  --lose-bg: rgba(255, 77, 106, 0.1);
  
  --gold: #ffc107;
  --orange: #ff8c42;
  --purple: #b066ff;
  --green: #34d399;
  --cyan: #22d3ee;
  
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  
  --font-sans: -apple-system, BlinkMacSystemFont, 'Inter', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
}

html, body {
  font-family: var(--font-sans);
  background: #000;
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
  width: 100%;
  overflow-x: hidden;
}

body {
  background: var(--bg);
  padding-bottom: calc(68px + var(--safe-bottom));
  min-height: 100vh;
  position: relative;
}

/* 移动端容器 - 居中限制最大宽度 */
.app-container {
  max-width: 480px;
  margin: 0 auto;
  position: relative;
}

/* ========== 顶部导航栏 ========== */
.top-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(13, 15, 20, 0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding-top: var(--safe-top);
}
.top-nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  height: 52px;
}
.top-nav-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-dot {
  width: 8px;
  height: 8px;
  background: var(--green);
  border-radius: 50%;
  animation: pulse-green 2s infinite;
}
@keyframes pulse-green {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.4); }
  50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); }
}
.top-nav-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--bg-card);
  color: var(--text-secondary);
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
}
.icon-btn:active { background: var(--bg-elevated); transform: scale(0.92); }
.last-update {
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

/* ========== 内容区域 ========== */
.page-content {
  padding: 12px 12px 20px;
}

.tab-page { display: none; }
.tab-page.active { display: block; animation: pageFadeIn 0.2s ease; }
@keyframes pageFadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== 召唤师头部卡片 ========== */
.profile-card {
  background: linear-gradient(180deg, #1a2340 0%, var(--bg-card) 100%);
  border-radius: var(--radius-lg);
  padding: 20px 18px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
.profile-card::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 120px;
  height: 120px;
  background: radial-gradient(circle, rgba(74, 125, 255, 0.15) 0%, transparent 70%);
  pointer-events: none;
}

.profile-top {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}
.avatar-wrap {
  position: relative;
  flex-shrink: 0;
}
.avatar {
  width: 64px;
  height: 64px;
  border-radius: var(--radius);
  border: 2px solid var(--brand);
  object-fit: cover;
  background: var(--bg-elevated);
}
.status-ring {
  position: absolute;
  bottom: -2px;
  right: -2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 3px solid var(--bg-card);
}
.status-ring.online { background: var(--green); }
.status-ring.offline { background: var(--text-muted); }
.status-ring.unknown { background: var(--gold); }

.profile-info { flex: 1; min-width: 0; }
.profile-name {
  font-size: 20px;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.profile-status {
  font-size: 12px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
}

/* 段位信息 - 支持多队列 */
.ranked-section {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 12px;
}
.ranked-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: rgba(0,0,0,0.2);
  border-radius: var(--radius);
}
.ranked-row.secondary {
  padding: 8px 12px;
  background: rgba(0,0,0,0.1);
}
.ranked-queue-label {
  font-size: 9px;
  color: var(--text-muted);
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.tier-badge {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, #b066ff 0%, #8b5cf6 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 13px;
  color: white;
  flex-shrink: 0;
}
.ranked-row.secondary .tier-badge {
  width: 36px;
  height: 36px;
  font-size: 11px;
}
.tier-text {
  flex: 1;
  min-width: 0;
}
.tier-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
}
.ranked-row.secondary .tier-name {
  font-size: 13px;
}
.tier-lp {
  font-size: 11px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
}
.wr-mini {
  text-align: center;
}
.wr-num {
  font-size: 17px;
  font-weight: 700;
  color: var(--win);
  font-family: var(--font-mono);
}
.ranked-row.secondary .wr-num {
  font-size: 14px;
}
.wr-label {
  font-size: 9px;
  color: var(--text-muted);
  text-transform: uppercase;
}
.rank-glob {
  text-align: center;
}
.rank-glob-num {
  font-size: 15px;
  font-weight: 700;
  color: var(--gold);
  font-family: var(--font-mono);
}
.rank-glob-label {
  font-size: 9px;
  color: var(--text-muted);
}

/* 账号切换 */
.account-chips {
  display: flex;
  gap: 8px;
}
.acct-chip {
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.03);
  color: var(--text-tertiary);
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.acct-chip:active { transform: scale(0.95); }
.acct-chip.active {
  background: var(--brand-dim);
  border-color: var(--brand-glow);
  color: var(--brand);
}
.acct-chip .live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
}

/* ========== 直播横幅 ========== */
.live-banner {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: linear-gradient(135deg, rgba(255,77,106,0.15) 0%, rgba(255,140,66,0.1) 100%);
  border: 1px solid rgba(255,77,106,0.3);
  border-radius: var(--radius);
  margin-bottom: 12px;
  animation: slideDown 0.3s ease;
}
.live-banner.show { display: flex; }
.live-tag {
  padding: 4px 8px;
  background: var(--lose);
  color: white;
  font-size: 10px;
  font-weight: 700;
  border-radius: 4px;
  letter-spacing: 0.05em;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 4px;
}
.live-tag .dot {
  width: 5px;
  height: 5px;
  background: white;
  border-radius: 50%;
  animation: pulse-dot 1s infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
.live-banner-text {
  flex: 1;
  min-width: 0;
}
.live-banner-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.live-banner-meta {
  font-size: 11px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  margin-top: 2px;
}
.live-watch {
  padding: 6px 12px;
  background: var(--lose);
  color: white;
  text-decoration: none;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  flex-shrink: 0;
}

/* ========== 数据概览卡片 ========== */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 10px;
  text-align: center;
}
.stat-val {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}
.stat-val.win { color: var(--win); }
.stat-val.lose { color: var(--lose); }
.stat-val.gold { color: var(--gold); }
.stat-label {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 4px;
  font-weight: 500;
}

/* ========== 区块标题 ========== */
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 20px 4px 10px;
}
.section-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title-bar {
  width: 3px;
  height: 14px;
  background: var(--brand);
  border-radius: 2px;
}
.section-action {
  font-size: 12px;
  color: var(--brand);
  font-weight: 500;
  cursor: pointer;
}

/* ========== 比赛卡片 - 移动端优化 ========== */
.match-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ========== 比赛卡片 - 参考电竞GG堂布局 ========== */
.match-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
  margin-bottom: 8px;
}
.match-card.win {
  background: rgba(59, 142, 255, 0.08);
  border-color: rgba(59, 142, 255, 0.2);
}
.match-card.lose {
  background: rgba(255, 77, 106, 0.08);
  border-color: rgba(255, 77, 106, 0.2);
}
.match-card:active {
  transform: scale(0.98);
}

/* 卡片头部：模式+时间+时长+装备 */
.match-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 10px;
  background: rgba(0,0,0,0.15);
}
.match-header-left {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text-secondary);
  font-family: var(--font-mono);
}
.match-header-items {
  display: flex;
  gap: 2px;
}

/* 卡片主体 */
.match-main {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px;
}

/* 英雄+技能区域 */
.match-champ-area {
  display: flex;
  gap: 5px;
  flex-shrink: 0;
}
.match-champ {
  position: relative;
  flex-shrink: 0;
}
.champ-icon {
  width: 52px;
  height: 52px;
  border-radius: var(--radius-sm);
  border: 2px solid var(--border-light);
}
.champ-lvl {
  position: absolute;
  bottom: -2px;
  right: -2px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text-primary);
  font-size: 9px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 4px;
  font-family: var(--font-mono);
}

/* 技能+符文：2x2网格 */
.match-spells {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 2px;
  flex-shrink: 0;
}
.spell-rune {
  width: 23px;
  height: 23px;
  border-radius: 4px;
  border: 1px solid var(--border);
  display: block;
  object-fit: cover;
}

/* 信息区域：徽章+KDA+补刀经济 */
.match-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-top: 2px;
}
.match-badges {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.badge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 10px;
  letter-spacing: 0.02em;
}
.badge-mvp { background: var(--gold); color: #000; }
.badge-svp { background: var(--purple); color: white; }
.badge-ace { background: var(--lose); color: white; }
/* 排名徽章（灰色椭圆） */
.badge-rank {
  background: rgba(255,255,255,0.1);
  color: var(--text-secondary);
  font-weight: 600;
}
/* 连杀徽章（红色胶囊） */
.badge-multikill {
  background: rgba(255, 77, 106, 0.9);
  color: white;
}

.kda-line {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.kda-k { color: var(--text-primary); }
.kda-d { color: var(--lose); }
.kda-a { color: var(--cyan); }
.kda-sep { color: var(--text-muted); font-weight: 400; margin: 0 2px; }

.match-stats-sub {
  display: flex;
  gap: 10px;
  font-size: 11px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
}
.match-cs {
  color: var(--text-secondary);
}
.match-gold {
  color: var(--gold);
}
.match-op-score {
  font-weight: 600;
}
.op-score-good { color: var(--gold); }
.op-score-great { color: var(--orange); }

/* 装备槽位 - 放在header右侧 */
.item-slot {
  width: 22px;
  height: 22px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: rgba(0,0,0,0.3);
}
.item-slot.empty { opacity: 0.3; background: rgba(255,255,255,0.05); }

/* 右侧展开箭头区域 */
.match-meta {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  padding-top: 2px;
  gap: 4px;
}
.match-duration {
  font-size: 12px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
}

/* 比赛详情 - 紧凑5v5 */
.match-detail {
  display: none;
  border-top: 1px solid var(--border);
  background: rgba(0,0,0,0.3);
}
.match-detail.show { display: block; }
.detail-team-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 10px;
  font-size: 11px;
  font-weight: 700;
}
.detail-team-header.win { background: rgba(59, 142, 255, 0.15); color: var(--win); }
.detail-team-header.lose { background: rgba(255, 77, 106, 0.15); color: var(--lose); }
.detail-kda-row {
  display: flex;
  gap: 12px;
  font-family: var(--font-mono);
  font-size: 11px;
}
.detail-bans {
  display: flex;
  gap: 2px;
  align-items: center;
}
.detail-ban-icon {
  width: 16px;
  height: 16px;
  border-radius: 2px;
  opacity: 0.5;
  filter: grayscale(0.8);
}
.detail-player {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  font-size: 11px;
}
.detail-player.me { background: rgba(74,125,255,0.1); }
.detail-player-champ {
  width: 22px;
  height: 22px;
  border-radius: 3px;
  flex-shrink: 0;
}
.detail-player-spells {
  display: flex;
  flex-direction: column;
  gap: 1px;
  flex-shrink: 0;
}
.detail-player-spells img {
  width: 12px;
  height: 12px;
  border-radius: 2px;
}
.detail-player-name {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text-secondary);
  font-size: 11px;
}
.detail-player.me .detail-player-name { color: var(--brand); font-weight: 600; }
.detail-player-kda {
  font-family: var(--font-mono);
  color: var(--text-secondary);
  font-size: 11px;
  width: 52px;
  text-align: right;
  flex-shrink: 0;
}
.detail-player-rank {
  font-size: 10px;
  color: var(--text-tertiary);
  width: 70px;
  text-align: right;
  flex-shrink: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.detail-items-mini {
  display: flex;
  gap: 1px;
  flex-shrink: 0;
}
.detail-items-mini .item-slot {
  width: 16px;
  height: 16px;
}

/* ========== 英雄统计 ========== */
.champ-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.champ-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 10px;
  background: var(--bg-card);
  padding: 4px;
  border-radius: var(--radius-sm);
}
.champ-tab {
  flex: 1;
  padding: 7px;
  text-align: center;
  font-size: 12px;
  font-weight: 500;
  border-radius: 5px;
  color: var(--text-tertiary);
  cursor: pointer;
  transition: all 0.15s;
}
.champ-tab.active {
  background: var(--bg-elevated);
  color: var(--brand);
  font-weight: 600;
}

.champ-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  margin-bottom: 4px;
}
.champ-sm-icon {
  width: 36px;
  height: 36px;
  border-radius: 6px;
  border: 1px solid var(--border);
}
.champ-info {
  flex: 1;
  min-width: 0;
}
.champ-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}
.champ-stats {
  display: flex;
  gap: 12px;
  font-size: 11px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  margin-top: 2px;
}
.champ-plays {
  text-align: right;
  font-family: var(--font-mono);
}
.champ-wr-num {
  font-size: 14px;
  font-weight: 700;
}

}
.pull-refresh.show { display: block; }

.spinner {

.loading-state {

}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>

  profile: RAW + '.theshy_profile.json',
  matches: RAW + '.theshy_matches.json',
};
const API_BASE = `https://api.github.com/repos/${REPO}/`;

const TIER_NAMES = {
  CHALLENGER: '王者', GRANDMASTER: '宗师', MASTER: '大师',
  DIAMOND: '钻石', EMERALD: '翡翠', PLATINUM: '铂金',
  GOLD: '黄金', SILVER: '白银', BRONZE: '青铜', IRON: '黑铁',
};
const TIER_SHORT = {
  CHALLENGER: 'C', GRANDMASTER: 'GM', MASTER: 'M',
  DIAMOND: 'D', EMERALD: 'E', PLATINUM: 'P',
  GOLD: 'G', SILVER: 'S', BRONZE: 'B', IRON: 'I',
};
const DIVISION_NAMES = { 1: 'I', 2: 'II', 3: 'III', 4: 'IV' };
const GAME_TYPES = {
  SOLORANKED: '单双排', FLEXRANKED: '灵活组排', ARENA: '竞技场',
  NORMAL: '匹配', ARAM: '大乱斗', RANKED: '排位', BOT: '人机',
};

const DD_VER = '16.14.1';
const CD_DD = `https://ddragon.leagueoflegends.com/cdn/${DD_VER}`;
const CD_CD = 'https://cdn.communitydragon.org/latest';
const CD_OPGG = 'https://opgg-static.akamaized.net/images/lol';

const IMG_ERR = "this.style.opacity=0.3;this.onerror=null;";
const champIcon = id => id ? `${CD_CD}/champion/${id}/square` : '';
const itemIcon = id => id ? `${CD_DD}/img/item/${id}.png` : '';
const perkIcon = id => id ? `${CD_OPGG}/perk/${id}.png` : '';
const perkStyleIcon = id => id ? `${CD_OPGG}/perkStyle/${id}.png` : '';

function runeHtml(rune) {
  if (!rune) return '';
  let p = '';
  if (rune.primary_rune_id) {
    const pri = perkIcon(rune.primary_rune_id);
    const fb = rune.primary_page_id ? perkStyleIcon(rune.primary_page_id) : '';
    if (fb) {
      p = `<img class="spell-rune" src="${pri}" onerror="this.onerror=null;this.src='${fb}';this.style.opacity=0.3;">`;
    } else {
      p = `<img class="spell-rune" src="${pri}" onerror="${IMG_ERR}">`;
    }
  } else if (rune.primary_page_id) {
    p = `<img class="spell-rune" src="${perkStyleIcon(rune.primary_page_id)}" onerror="${IMG_ERR}">`;
  }
  if (rune.secondary_page_id && p) {
    p += `<img class="spell-rune" src="${perkStyleIcon(rune.secondary_page_id)}" onerror="${IMG_ERR}">`;
  }
  return p;
}

const SUMMONER_SPELL_FILES = {
  1:'SummonerBoost', 3:'SummonerExhaust', 4:'SummonerFlash', 6:'SummonerHaste',
  7:'SummonerHeal', 11:'SummonerSmite', 12:'SummonerTeleport', 14:'SummonerDot',
  21:'SummonerBarrier', 13:'SummonerMana'
};
const spellIcon = id => {
  const f = SUMMONER_SPELL_FILES[id];
  return f ? `${CD_OPGG}/spell/${f}.png` : '';
};

function calcKda(k,d,a) {
  k=+k||0; d=+d||0; a=+a||0;
  if (d===0) return k+a>0?'Perfect':'0.00';
  return ((k+a)/d).toFixed(2);
}

function fmtKstTime(iso) {
  if (!iso) return '--:--';
  try {
    const d = new Date(iso);
    return d.toLocaleTimeString('zh-CN', { timeZone:'Asia/Seoul', hour:'2-digit', minute:'2-digit' });
  } catch { return '--:--'; }
}

function ageStr(iso) {
  if (!iso) return '';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return `${Math.floor(s)}秒前`;
  if (s < 3600) return `${Math.floor(s/60)}分钟前`;
  if (s < 86400) return `${Math.floor(s/3600)}小时前`;
  return `${Math.floor(s/86400)}天前`;
}

function isMe(p) {
  if (!p) return false;
  const a = currentData?.account;
  if (a) return p.summoner_name === a.game_name && p.summoner_tag === a.tag_line;
  return p.summoner_name === 'The shy' && p.summoner_tag === 'asdf';
}

function multiKillBadge(n) {
  if (!n || n < 2) return '';
  const l = {2:'双杀',3:'三杀',4:'四杀',5:'五杀'};
  return `<span class="badge badge-ace">${l[n]||n+'杀'}</span>`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

async function fetchJson(url) {
  const r = await fetch(`${url}?t=${Date.now()}`, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${r.status}`);
  return r.json();
}

let allData = null;
let currentSlug = null;
let currentData = { state:null, events:[], profile:null, matches:[], account:null };
let eventFilter = 'all';
let champTabIdx = 0;

function selectAccount(slug) {
  if (!allData?.accounts) return;
  const acct = allData.accounts.find(a => a.slug === slug) || allData.accounts[0];
  if (!acct) return;
  currentSlug = acct.slug;
  currentData = {
    state: { profile: acct.profile, is_active: acct.state?.is_active, last_check: acct.state?.last_check },
    events: allData.events || [],
    profile: acct.profile,
    matches: acct.matches || [],
    account: acct,
  };
  renderAccountChips();
  renderAll();
}

function renderAccountChips() {
  const c = document.getElementById('account-chips');
  if (!allData?.accounts || allData.accounts.length <= 1) {
    c.innerHTML = ''; c.style.display = 'none'; return;
  }
  c.style.display = '';
  c.innerHTML = allData.accounts.map(a => `
    <div class="acct-chip${a.slug===currentSlug?' active':''}" data-slug="${a.slug}">
      ${a.state?.is_active ? '<span class="live-dot"></span>' : ''}
      <span>${a.label}</span>
    </div>
  `).join('');
  c.querySelectorAll('.acct-chip').forEach(el => {
    el.addEventListener('click', () => selectAccount(el.dataset.slug));
  });
}

async function refresh() {
  const btn = document.getElementById('refresh-btn');
  btn.style.transform = 'rotate(360deg)';
  btn.style.transition = 'transform 0.5s';
  try {
    let data = null;
    try { data = await fetchJson(FILES.data); } catch(e) {}

    if (data?.accounts?.length) {
      const events = await fetchJson(FILES.events).catch(() => []);
      allData = { ...data, events: events||[] };
      let target = currentSlug;
      if (!target || !allData.accounts.find(a=>a.slug===target)) {
        const live = allData.accounts.find(a=>a.state?.is_active);
        target = live ? live.slug : allData.accounts[0].slug;
      }
      selectAccount(target);
    } else {
      const [state, events, profile, matches] = await Promise.all([
        fetchJson(FILES.state).catch(()=>null),
        fetchJson(FILES.events).catch(()=>[]),
        fetchJson(FILES.profile).catch(()=>null),
        fetchJson(FILES.matches).catch(()=>[]),
      ]);
      allData = null;
      currentSlug = 'main';
      currentData = { state, events: events||[], profile, matches: matches||[], account:null };
      renderAccountChips();
      renderAll();
    }
    const now = new Date();
    document.getElementById('last-update').textContent = 
      `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    showToast('已刷新');
  } catch(e) {
    showToast('刷新失败');
  }
  setTimeout(() => { btn.style.transform = ''; btn.style.transition = ''; }, 500);
}

function deriveStatus(state, profile) {
  const updated = profile?.updated_at || state?.profile?.updated_at;
  if (!updated) return { level:'offline', text:'暂无数据' };
  const s = (Date.now() - new Date(updated).getTime()) / 1000;
  if (s < 300) return { level:'online', text:`游戏中 · ${Math.floor(s)}秒前` };
  if (s < 1800) return { level:'unknown', text:`${ageStr(updated)}更新` };
  return { level:'offline', text:`离线 · ${ageStr(updated)}` };
}

function renderProfile() {
  const { state, profile } = currentData;
  const p = profile || state?.profile || {};

  if (p.profile_image_url) {
    document.getElementById('avatar').src = p.profile_image_url;
  }
  document.getElementById('profile-name').textContent = p.game_name || p.name || currentData.account?.game_name || 'TheShy';

  const st = deriveStatus(state, profile);
  document.getElementById('status-ring').className = `status-ring ${st.level}`;
  document.getElementById('profile-status').textContent = st.text;

  const section = document.getElementById('ranked-section');
  const ls = (p.league_stats||[]).filter(l => l.game_type !== 'ARENA');

  // 排位队列排序：单双排优先
  const queueOrder = { SOLORANKED: 0, RANKED: 0, FLEXRANKED: 1 };
  ls.sort((a,b) => (queueOrder[a.game_type] ?? 99) - (queueOrder[b.game_type] ?? 99));

  if (ls.length) {
    let globalRankHtml = '';
    if (p.ladder_rank?.rank) {
      const rk = p.ladder_rank.rank;
      globalRankHtml = `<div class="rank-glob">
        <div class="rank-glob-num">#${rk>=10000?(rk/10000).toFixed(1)+'w':rk.toLocaleString()}</div>
        <div class="rank-glob-label">全服</div>
      </div>`;
    }

    function buildRankedRow(l, isSecondary) {
      const tierName = TIER_NAMES[l.tier] || '';
      const divName = l.division ? DIVISION_NAMES[l.division] : '';
      const play = l.play || (l.match_win||0)+(l.match_lose||0);
      const wins = l.match_win ?? l.win ?? 0;
      const losses = l.match_lose ?? l.lose ?? 0;
      const wr = play ? (wins/play*100).toFixed(0) : 0;
      const tierShort = TIER_SHORT[l.tier] || (tierName ? tierName.charAt(0) : '?');
      const queueName = GAME_TYPES[l.game_type] || '';
      
      // 不同队列不同颜色徽章
      let badgeStyle = '';
      if (l.game_type === 'SOLORANKED' || l.game_type === 'RANKED') {
        badgeStyle = 'background: linear-gradient(135deg, #b066ff 0%, #8b5cf6 100%);';
      } else {
        badgeStyle = 'background: linear-gradient(135deg, #4a7dff 0%, #3b8eff 100%);';
      }

      return `<div class="ranked-row${isSecondary?' secondary':''}">
        <div class="tier-badge" style="${badgeStyle}">${tierShort}</div>
        <div class="tier-text">
          ${isSecondary ? `<div class="ranked-queue-label">${queueName}</div>` : ''}
          <div class="tier-name">${tierName} ${divName}</div>
          <div class="tier-lp">${l.lp??0} LP · ${wins}胜${losses}负 · ${play}场</div>
        </div>
        <div class="wr-mini">
          <div class="wr-num">${wr}%</div>
          <div class="wr-label">胜率</div>
        </div>
        ${!isSecondary ? globalRankHtml : ''}
      </div>`;
    }

    let html = '';
    ls.forEach((l, idx) => {
      html += buildRankedRow(l, idx > 0);
    });
    section.innerHTML = html;
  } else {
    section.innerHTML = '<div class="ranked-row"><div style="color:var(--text-muted);font-size:13px;">未定级</div></div>';
  }
}

function renderStats() {
  const { matches } = currentData;
  const row = document.getElementById('stats-row');
  if (!matches?.length) { row.innerHTML = ''; return; }

  const recent = matches.slice(0, 20);
  const wins = recent.filter(m => m.result === 'WIN').length;
  const wr = recent.length ? Math.round(wins/recent.length*100) : 0;

  let streak = 0, streakType = null;
  for (const m of matches) {
    if (!streakType) { streakType = m.result; streak = 1; }
    else if (m.result === streakType) streak++;
    else break;
  }

  const todayStats = allData?.daily_stats?.[currentSlug];
  let cards = [];
  if (todayStats?.today_matches) {
    cards.push({ val: todayStats.today_matches, label: '今日', cls: '' });
  }
  cards.push({ val: `${wr}%`, label: `近${recent.length}场胜率`, cls: wins>=recent.length-wins?'win':'lose' });
  cards.push({
    val: streak,
    label: streakType==='WIN'?'🔥连胜':'💔连败',
    cls: streakType==='WIN'?'win':'lose'
  });

  let tK=0,tD=0,tA=0;
  recent.forEach(m=>{tK+=m.kill||0;tD+=m.death||0;tA+=m.assist||0;});
  const avgKda = tD===0?'P':((tK+tA)/tD).toFixed(1);
  cards.push({ val: avgKda, label: '平均KDA', cls: 'gold' });

  // 只显示前3-4个
  cards = cards.slice(0, 3);
  row.innerHTML = cards.map(c =>
    `<div class="stat-card"><div class="stat-val ${c.cls}">${c.val}</div><div class="stat-label">${c.label}</div></div>`
  ).join('');
}

function buildMatchCard(m, idx, expandable) {
  const win = m.result === 'WIN';
  const sec = m.game_length_second || 0;
  const min = Math.floor(sec/60);
  const time = fmtKstTime(m.created_at);
  const isMvp = m.op_score_rank === 1;
  const isSvp = m.op_score_rank === 2;
  const opRank = m.op_score_rank;

  // 徽章：排名/MVP/SVP/连杀
  const badges = [];
  if (isMvp) {
    badges.push('<span class="badge badge-mvp">MVP</span>');
  } else if (isSvp) {
    badges.push('<span class="badge badge-svp">SVP</span>');
  } else if (opRank && opRank >= 2 && opRank <= 10) {
    // 排名徽章（2-10名显示，如"5th"）
    const suffixes = ['th','st','nd','rd','th','th','th','th','th','th','th'];
    const suffix = opRank <= 3 ? suffixes[opRank] : 'th';
    badges.push(`<span class="badge badge-rank">${opRank}${suffix}</span>`);
  }
  const mk = multiKillBadge(m.largest_multi_kill);
  if (mk) {
    // 将mk转换为badge-multikill样式
    const mkText = mk.replace(/class="[^"]*"/, 'class="badge badge-multikill"');
    badges.push(mkText);
  }

  // 装备：7格（6装备+1饰品），单行排列在header右侧
  const items = (m.items||[]).slice(0,7);
  while (items.length < 7) items.push(0);
  const buildItem = iid => iid 
    ? `<img class="item-slot" src="${itemIcon(iid)}" onerror="${IMG_ERR}">`
    : '<span class="item-slot empty"></span>';
  const itemsHtml = `<div class="match-header-items">${items.map(buildItem).join('')}</div>`;

  // 召唤师技能（2个）+ 主副符文（2个），2x2网格排列
  const spells = (m.spells||[]).slice(0,2);
  let spellImgs = spells.map(s => `<img class="spell-rune" src="${spellIcon(s)}" onerror="${IMG_ERR}">`);
  // 取前2个符文
  const runeImgs = runeHtml(m.rune).match(/<img[^>]*>/g) || [];
  runeImgs.slice(0,2).forEach(runeImg => {
    const fixed = runeImg.replace(/class="[^"]*"/, 'class="spell-rune"').replace(/style="[^"]*"/g, '');
    spellImgs.push(fixed);
  });
  while (spellImgs.length < 4) spellImgs.push('<span class="spell-rune" style="background:rgba(0,0,0,0.2);"></span>');
  // 2x2排列：技能1 符文1 / 技能2 符文2
  const spellsHtml = `${spellImgs[0]}${spellImgs[2]}${spellImgs[1]}${spellImgs[3]}`;

  const kda = calcKda(m.kill, m.death, m.assist);
  const cs = m.cs || m.minion_kill || 0;
  const gold = m.gold_earned ? Math.round(m.gold_earned / 1000) : null;
  const opScore = m.op_score;
  let opClass = '';
  if (opScore >= 8.0) opClass = 'op-score-great';
  else if (opScore >= 6.5) opClass = 'op-score-good';

  // 统计行：CS / 经济 / KDA比 / OP评分
  const statsParts = [];
  statsParts.push(`<span class="match-cs">${cs}刀</span>`);
  if (gold) statsParts.push(`<span class="match-gold">${gold}k</span>`);
  statsParts.push(`<span>${kda} KDA</span>`);
  if (opScore) statsParts.push(`<span class="match-op-score ${opClass}">${typeof opScore === 'number' ? opScore.toFixed(1) : opScore}</span>`);
  const statsLine = `<div class="match-stats-sub">${statsParts.join('<span style="opacity:0.3">·</span>')}</div>`;

  return `
    <div class="match-card ${win?'win':'lose'}" data-idx="${idx}">
      <!-- 卡片头部：模式 时间 时长 装备 -->
      <div class="match-header">
        <div class="match-header-left">
          <span>${GAME_TYPES[m.game_type]||''}</span>
          <span>${time}</span>
          <span>${min}分钟</span>
        </div>
        ${itemsHtml}
      </div>
      <!-- 卡片主体：英雄+技能 徽章 KDA 展开按钮 -->
      <div class="match-main">
        <div class="match-champ-area">
          <div class="match-champ">
            <img class="champ-icon" src="${champIcon(m.champion_id)}" onerror="${IMG_ERR}">
            ${m.champion_level ? `<span class="champ-lvl">${m.champion_level}</span>` : ''}
          </div>
          <div class="match-spells">
            ${spellsHtml}
          </div>
        </div>
        <div class="match-info">
          <div class="match-badges">${badges.join('')}</div>
          <div class="kda-line">
            <span class="kda-k">${m.kill||0}</span><span class="kda-sep">/</span><span class="kda-d">${m.death||0}</span><span class="kda-sep">/</span><span class="kda-a">${m.assist||0}</span>
          </div>
          ${statsLine}
        </div>
        ${expandable ? `
        <div class="match-meta" style="cursor:pointer;">
          <span style="font-size:16px;opacity:0.4;">›</span>
        </div>` : `
        <div class="match-meta">
          <div class="match-duration">${min}分</div>
        </div>`}
      </div>
      ${expandable ? `<div class="match-detail" data-detail="${idx}">${renderMatchDetail(m)}</div>` : ''}
    </div>
  `;
}

function renderMatchDetail(m) {
  const parts = m.participants || [];
  if (!parts.length) return '<div class="empty-state">无详情</div>';
  const blue = parts.filter(p => p.team_key === 'BLUE');
  const red = parts.filter(p => p.team_key === 'RED');

  function teamKda(t) { let k=0,d=0,a=0; t.forEach(p=>{k+=p.kill||0;d+=p.death||0;a+=p.assist||0;}); return {k,d,a}; }
  function teamBans(t) {
    const bans = [];
    t.forEach(p => {
      if (p.banned_champion_id) {
        Array.isArray(p.banned_champion_id) 
          ? bans.push(...p.banned_champion_id) 
          : bans.push(p.banned_champion_id);
      }
    });
    return bans.slice(0,5);
  }
  const bk = teamKda(blue), rk = teamKda(red);
  const blueWin = blue[0]?.result === 'WIN';
  const redWin = red[0]?.result === 'WIN';

  function miniSpells(p) {
    const spells = (p.spells||[]).slice(0,2).map(s => 
      `<img src="${spellIcon(s)}" onerror="${IMG_ERR}">`
    ).join('');
    return `<div class="detail-player-spells">${spells}</div>`;
  }

  function tierStr(p) {
    // 尝试提取段位信息（如果有）
    if (p.tier_info) {
      const t = p.tier_info;
      const tName = TIER_SHORT[t.tier] || '';
      const d = t.division ? DIVISION_NAMES[t.division] : '';
      const lp = t.lp ? ` ${t.lp}` : '';
      return `${tName}${d}${lp}`;
    }
    if (p.league_tier) {
      return TIER_SHORT[p.league_tier] || '';
    }
    return '';
  }

  function pRow(p) {
    const me = isMe(p);
    const pItems = (p.items||[]).slice(0,7).map(iid =>
      iid ? `<img class="item-slot" src="${itemIcon(iid)}" onerror="${IMG_ERR}">`
          : '<span class="item-slot empty"></span>'
    ).join('');
    const rank = tierStr(p);
    return `<div class="detail-player ${me?'me':''}">
      <img class="detail-player-champ" src="${champIcon(p.champion_id)}" onerror="${IMG_ERR}">
      ${miniSpells(p)}
      <span class="detail-player-name">${p.summoner_name||'?'}</span>
      ${rank ? `<span class="detail-player-rank">${rank}</span>` : ''}
      <span class="detail-player-kda">${p.kill||0}/${p.death||0}/${p.assist||0}</span>
      <span class="detail-items-mini">${pItems}</span>
    </div>`;
  }

  function buildTeamHeader(team, kda, isWin, teamName) {
    const bans = teamBans(team);
    const bansHtml = bans.length ? `<div class="detail-bans">${bans.map(cid =>
      `<img class="detail-ban-icon" src="${champIcon(cid)}" onerror="${IMG_ERR}">`
    ).join('')}</div>` : '';
    return `<div class="detail-team-header ${isWin?'win':'lose'}">
      <div style="display:flex;align-items:center;gap:8px;">
        <span>${teamName} ${isWin?'胜':'负'}</span>
        ${bansHtml}
      </div>
      <div class="detail-kda-row">
        <span>⚔${kda.k}/${kda.d}/${kda.a}</span>
      </div>
    </div>`;
  }

  return `
    ${buildTeamHeader(blue, bk, blueWin, '蓝方')}
    ${blue.map(pRow).join('')}
    ${buildTeamHeader(red, rk, redWin, '红方')}
    ${red.map(pRow).join('')}
  `;
}

function renderMatches() {
  const { matches } = currentData;
  // 最近8场
  const recent = document.getElementById('matches-recent');
  if (recent) {
    if (!matches?.length) {
      recent.innerHTML = '<div class="empty-state">暂无比赛</div>';
    } else {
      recent.innerHTML = matches.slice(0,8).map((m,i) => buildMatchCard(m,i,false)).join('');
    }
  }
  // 全部
  const all = document.getElementById('matches-all');
  if (all) {
    if (!matches?.length) {
      all.innerHTML = '<div class="empty-state">暂无比赛记录</div>';
    } else {
      all.innerHTML = matches.map((m,i) => buildMatchCard(m,i,true)).join('');
      all.querySelectorAll('.match-card').forEach(card => {
        card.addEventListener('click', () => {
          const d = card.querySelector('.match-detail');
          if (!d) return;
          const open = d.classList.contains('show');
          d.classList.toggle('show', !open);
        });
      });
    }
  }
}

let champData = null;
function renderChampTabs() {
  const { profile } = currentData;
  const tabs = [];
  if (profile?.most_champions?.champion_stats?.length) {
    tabs.push({ key:'season', label:`赛季`, data:profile.most_champions, type:'season' });
  }
  if (profile?.ranked_most_champions?.my_champion_stats?.length) {
    tabs.push({ key:'ranked', label:`排位`, data:profile.ranked_most_champions, type:'ranked' });
  }
  champData = tabs;
  if (champTabIdx >= tabs.length) champTabIdx = 0;

  const topTabs = document.getElementById('champ-tabs-top');
  if (topTabs && tabs.length > 1) {
    topTabs.innerHTML = tabs.map((t,i) =>
      `<div class="champ-tab${i===champTabIdx?' active':''}" data-idx="${i}">${t.label}</div>`
    ).join('');
    topTabs.querySelectorAll('.champ-tab').forEach(t => {
      t.addEventListener('click', () => { champTabIdx = +t.dataset.idx; renderChampList(); });
    });
  } else if (topTabs) {
    topTabs.innerHTML = '';
  }
}

function renderChampList() {
  renderChampTabs();
  const list = document.getElementById('champ-list');
  if (!list) return;
  if (!champData?.length) { list.innerHTML = '<div class="empty-state">暂无英雄统计</div>'; return; }

  const tab = champData[champTabIdx] || champData[0];
  const stats = tab.type === 'season' ? tab.data.champion_stats : tab.data.my_champion_stats;

  list.innerHTML = stats.slice(0,20).map(c => {
    const wr = c.play ? ((c.win||0)/c.play*100) : 0;
    const kda = calcKda(c.kill, c.death, c.assist);
    const color = wr >= 50 ? 'var(--win)' : 'var(--lose)';
    return `<div class="champ-row">
      <img class="champ-sm-icon" src="${champIcon(c.champion_id)}" onerror="${IMG_ERR}">
      <div class="champ-info">
        <div class="champ-name">${c.champion_name||'?'}</div>
        <div class="champ-stats">
          <span>${c.play||0}场</span>
          <span>KDA ${kda}</span>
        </div>
      </div>
      <div class="champ-plays">
        <div class="champ-wr-num ${wr>=50?'win':'lose'}">${Math.round(wr)}%</div>
        <div class="wr-bar"><div class="wr-bar-fill" style="width:${wr}%;background:${color};"></div></div>
      </div>
    </div>`;
  }).join('');
}

function buildEvent(ev) {
  let cls = 'event-item', icon = '📌', title = ev.type, meta = '';
  const acct = ev.account ? `<span class="event-acct">${ev.account}</span>` : '';

  if (ev.type === 'became_active' || ev.type === 'opgg_updated') {
    cls += ' live'; icon = '🔥'; title = '开始排位';
    meta = `${acct}${ageStr(ev.updated_at)}`;
  } else if (ev.type === 'new_match') {
    cls += ev.result==='WIN'?' win':' lose';
    icon = ev.result==='WIN'?'🏆':'💔';
    title = `${GAME_TYPES[ev.game_type]||''} · ${ev.champion||''} · ${ev.result==='WIN'?'胜利':'失败'}`;
    meta = `${acct}${ev.kda||''} · ${fmtKstTime(ev.created_at)}`;
  } else if (ev.type === 'lp_changed' || ev.type === 'rank_changed') {
    cls += ' rank';
    icon = ev.delta >= 0 ? '📈' : '📉';
    title = ev.type === 'rank_changed' ? `段位: ${ev.old}→${ev.new}` : `LP ${ev.delta>=0?'+':''}${ev.delta}`;
    meta = acct + ageStr(ev.timestamp);
  } else if (ev.type === 'winning_streak' || ev.type === 'highlight') {
    cls += ' streak'; icon = '🔥';
    title = ev.type === 'winning_streak' ? `${ev.streak}连胜!` : `高光!${ev.is_mvp?' ⭐MVP':''}${ev.is_penta?' 💥五杀':''}`;
  } else if (ev.type === 'losing_streak') {
    cls += ' lose'; icon = '💔'; title = `${ev.streak}连败...`;
  } else if (ev.type === 'lpl_match') {
    cls += ' esports'; icon = '🏟️';
    title = ev.kind === 'pre' ? `即将: ${ev.team_a} vs ${ev.team_b}` :
            ev.kind === 'start' ? `开始: ${ev.team_a} vs ${ev.team_b}` :
            `${ev.team_a} vs ${ev.team_b}`;
    meta = ev.stage||'';
  } else if (ev.type === 'bilibili_live') {
    cls += ' live'; icon = '📺';
    title = ev.kind === 'ig_live_start' ? '🔴 IG比赛开播!' :
            ev.kind === 'ig_live_end' ? 'IG直播结束' : 'B站直播更新';
    meta = ev.title||'';
  } else if (ev.type === 'hupu_rating') {
    cls += ' esports'; icon = '⭐'; title = '虎扑评分已出'; meta = ev.title||'';
  } else if (ev.type === 'system_initialized') {
    icon = '🚀'; title = ev.msg || '监控启动';
  }

  return `<div class="${cls}">
    <div class="event-icon">${icon}</div>
    <div class="event-body">
      <div class="event-title">${title}</div>
      <div class="event-meta">${meta}</div>
    </div>
  </div>`;
}

function eventCat(ev) {
  const t = ev.type;
  if (t === 'new_match' || t === 'became_active') return 'match';
  if (t === 'lp_changed' || t === 'rank_changed') return 'rank';
  if (t === 'winning_streak' || t === 'losing_streak' || t === 'highlight') return 'streak';
  if (t === 'lpl_match' || t === 'bilibili_live' || t === 'hupu_rating') return 'esports';
  return 'other';
}

function renderEvents() {
  const events = currentData.events || [];

  // 全部（带筛选）
  const allEl = document.getElementById('events-all');
  if (allEl) {
    let filtered = events;
    if (eventFilter !== 'all') {
      filtered = events.filter(e => eventCat(e) === eventFilter);
    }
    allEl.innerHTML = filtered.length
      ? filtered.slice(0,100).map(buildEvent).join('')
      : '<div class="empty-state">暂无事件</div>';
  }

  // 赛事
  const esEl = document.getElementById('events-esports');
  if (esEl) {
    const es = events.filter(e => eventCat(e) === 'esports').slice(0,30);
    esEl.innerHTML = es.length ? es.map(buildEvent).join('') : '<div class="empty-state">暂无赛事动态</div>';
  }

  updateTabBadges();
}

function renderHupu() {
  const c = document.getElementById('hupu-container');
  if (!c) return;
  const hupu = allData?.hupu_ratings;
  const matches = hupu?.matches || [];
  const teamName = hupu?.team || 'IG';

  if (!matches.length) {
    c.innerHTML = '<div class="hupu-card"><div class="empty-state" style="padding:30px;">暂无IG比赛评分<br><span style="font-size:11px;opacity:0.6;margin-top:6px;display:block;">比赛结束后约30分钟虎扑会开放评分</span></div></div>';
    return;
  }

  function fmtDate(iso) {
    if (!iso) return '';
    try {
      const d = new Date(iso);
      return `${d.getMonth()+1}月${d.getDate()}日`;
    } catch(e) { return ''; }
  }

  function scoreClass(s) {
    if (s >= 8) return 'hupu-score-high';
    if (s >= 5) return 'hupu-score-mid';
    return 'hupu-score-low';
  }

  function barWidth(s) {
    return Math.max(15, Math.min(100, s * 10)) + '%';
  }

  function fmtVotes(n) {
    if (!n) return '';
    if (n >= 10000) return (n/10000).toFixed(1) + 'w';
    return String(n);
  }

  // 选手行（最新比赛详情用）
  function playerRow(p, isMvp) {
    return `<div class="hupu-player-row${isMvp?' mvp':''}">
      <span class="hupu-player-name">${p.name}</span>
      <div class="hupu-player-bar-wrap">
        <div class="hupu-player-bar ${scoreClass(p.avg)}" style="width:${barWidth(p.avg)}">
          <span class="hupu-player-score">${p.avg.toFixed(1)}</span>
        </div>
      </div>
      <span class="hupu-player-kda">${p.kda||'-'}</span>
      <span class="hupu-player-votes">${fmtVotes(p.total_count)}评</span>
    </div>`;
  }

  // 选手行（历史比赛展开用 - 精简版）
  function playerRowMini(p) {
    return `<div class="hupu-item-mini">
      <span class="hupu-player-name">${p.name}</span>
      <div class="hupu-player-bar-wrap">
        <div class="hupu-player-bar ${scoreClass(p.avg)}" style="width:${barWidth(p.avg)}">
          <span class="hupu-player-score">${p.avg.toFixed(1)}</span>
        </div>
      </div>
      <span class="hupu-player-kda">${p.kda||'-'}</span>
      <span class="hupu-player-votes">${fmtVotes(p.total_count)}</span>
    </div>`;
  }

  function teamBlock(players, label, isIg, teamWin) {
    if (!players || !players.length) return '';
    const sorted = [...players].sort((a,b) => b.avg - a.avg);
    const topScore = sorted[0].avg;
    const badge = teamWin ? '<span class="win-badge w">胜</span>' : '<span class="win-badge l">负</span>';
    return `<div class="hupu-team-block">
      <div class="hupu-team-label ${isIg?'ig':'opp'}">${badge} ${label}</div>
      ${sorted.map((p,i) => playerRow(p, i===0 && p.avg >= 8)).join('')}
    </div>`;
  }

  // 最新比赛
  const latest = matches[0];
  const igWin = latest.ig_win;
  const home = latest.home || '';
  const away = latest.away || '';
  const homeScore = latest.home_score ?? '-';
  const awayScore = latest.away_score ?? '-';
  const igAtHome = home === teamName;
  const igScore = igAtHome ? homeScore : awayScore;
  const oppScore = igAtHome ? awayScore : homeScore;
  const opponent = igAtHome ? away : home;
  const igColor = igWin ? 'var(--win)' : 'var(--lose)';
  const oppColor = igWin ? 'var(--text-secondary)' : 'var(--win)';
  const date = latest.date_str || fmtDate(latest.found_at);
  const stage = latest.round_name || latest.league_name || '';

  const igPlayers = (latest.ig_players || []).slice(0, 6);
  const oppPlayers = (latest.opp_players || []).slice(0, 6);

  const teamsHtml = (igPlayers.length || oppPlayers.length) ? `
    <div class="hupu-teams">
      ${teamBlock(igPlayers, teamName, true, !!igWin)}
      ${teamBlock(oppPlayers, opponent, false, !igWin)}
    </div>
    ${latest.total_scorers ? `<div class="hupu-scorers-count">${latest.total_scorers.toLocaleString()}人参与评分</div>` : ''}
  ` : '';

  // 往期比赛（可点击展开）
  const history = matches.slice(1);
  const historyHtml = history.length ? `
    <div class="hupu-history-head">
      <span>往期比赛</span>
      <span>共${matches.length}场</span>
    </div>
    <div class="hupu-history-list" id="hupu-history-list">
      ${history.map((m, idx) => {
        const mHome = m.home || '';
        const mAway = m.away || '';
        const mIgHome = mHome === teamName;
        const mIgWin = m.ig_win;
        const mIgScore = mIgHome ? (m.home_score ?? '-') : (m.away_score ?? '-');
        const mOppScore = mIgHome ? (m.away_score ?? '-') : (m.home_score ?? '-');
        const mOpp = mIgHome ? mAway : mHome;
        const mDate = m.date_str || fmtDate(m.found_at);
        const winClass = mIgWin ? 'win' : (mIgWin === false ? 'lose' : '');
        const mIgPlayers = (m.ig_players || []).slice(0, 6);
        const mOppPlayers = (m.opp_players || []).slice(0, 6);
        const hasDetail = mIgPlayers.length > 0;
        const detailHtml = hasDetail ? `<div class="hupu-item-detail">
          <div class="hupu-item-team-split">${teamName}</div>
          ${[...mIgPlayers].sort((a,b)=>b.avg-a.avg).map(playerRowMini).join('')}
          <div class="hupu-item-team-split">${mOpp}</div>
          ${[...mOppPlayers].sort((a,b)=>b.avg-a.avg).map(playerRowMini).join('')}
        </div>` : '';
        return `<div class="hupu-item ${winClass}" data-idx="${idx}" onclick="this.classList.toggle('open')">
          <div class="hupu-item-main">
            <span class="hupu-item-score">${mIgScore}-${mOppScore}</span>
            <div class="hupu-item-info">
              <div class="hupu-item-vs">${teamName} ${mIgScore}-${mOppScore} ${mOpp}</div>
              <div class="hupu-item-date">${mDate}${hasDetail?' · 点击查看评分':''}</div>
            </div>
            <span class="hupu-item-arrow">›</span>
          </div>
          ${detailHtml}
        </div>`;
      }).join('')}
    </div>
  ` : '';

  const winTag = igWin ? '🔥 最新赛果' : '😔 最新赛果';

  c.innerHTML = `<div class="hupu-card">
    <div class="hupu-head">
      <span class="hupu-logo">虎扑</span>
      <span style="font-weight:600;color:var(--text-primary);font-size:13px;">${teamName}比赛评分</span>
      <span class="hupu-count">共${matches.length}场</span>
    </div>

    <!-- 最新比赛突出 -->
    <div class="hupu-featured">
      <div class="hupu-featured-tag">${winTag}</div>
      <div class="hupu-featured-match">
        <div class="hupu-vs">
          <span class="hupu-team ig" style="color:${igAtHome ? igColor : 'var(--text-primary)'}">${teamName}</span>
          <span class="hupu-score-big">
            <span style="color:${igColor}">${igScore}</span><span class="dash">:</span><span style="color:${oppColor}">${oppScore}</span>
          </span>
          <span class="hupu-team" style="color:${!igAtHome ? oppColor : 'var(--text-primary)'}">${opponent}</span>
        </div>
      </div>
      <div class="hupu-featured-title">${stage ? stage + ' · ' : ''}${date}</div>
      ${teamsHtml}
    </div>

    ${historyHtml}
  </div>`;
  updateTabBadges();
}

function renderSeasons() {
  const { profile } = currentData;
  const c = document.getElementById('seasons-grid');
  if (!c || !profile) { c && (c.innerHTML = ''); return; }
  const prev = profile.previous_season_tiers || [];
  const seas = profile.previous_seasons || [];
  const all = {};
  for (const s of seas) all[s.season_id] = { tier:s.tier, division:s.division, lp:s.lp };
  for (const p of prev) {
    if (!all[p.season_id]) all[p.season_id] = {};
    all[p.season_id][p.game_type] = { tier:p.tier, division:p.division, win:p.win, lose:p.lose };
  }
  const ids = Object.keys(all).sort((a,b)=>b-a);
  if (!ids.length) { c.innerHTML = '<div class="empty-state">无历史</div>'; return; }
  c.innerHTML = ids.map(sid => {
    const s = all[sid];
    let rows = [];
    if (s.tier) rows.push(`<div class="kv-line"><span class="kv-k">最高</span><span class="kv-v" style="color:var(--gold);">${TIER_NAMES[s.tier]||s.tier} ${s.lp??0}LP</span></div>`);
    for (const gt of ['SOLORANKED','FLEXRANKED']) {
      if (s[gt]) rows.push(`<div class="kv-line"><span class="kv-k">${GAME_TYPES[gt]}</span><span class="kv-v">${TIER_NAMES[s[gt].tier]||s[gt].tier} · ${s[gt].win||0}W${s[gt].lose||0}L</span></div>`);
    }
    return `<div class="season-card"><div class="season-num">S${sid}</div>${rows.join('')}</div>`;
  }).join('');
}

function renderAll() {
  renderProfile();
  renderLiveBanners();
  renderStats();
  renderMatches();
  renderChampList();
  renderEvents();
  renderHupu();
  renderSeasons();
}

// ============================================================
// Tab切换
// ============================================================
const TAB_TITLES = { overview:'总览', matches:'战绩', esports:'赛事', activity:'动态' };

function switchTab(tabId) {
  document.querySelectorAll('.bottom-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tabId));
  document.querySelectorAll('.tab-page').forEach(p => p.classList.toggle('active', p.id === `page-${tabId}`));
  document.getElementById('nav-title').textContent = TAB_TITLES[tabId] || '';
  history.replaceState(null, '', `#${tabId}`);
  window.scrollTo({ top:0, behavior:'smooth' });
}

document.querySelectorAll('.bottom-tab').forEach(tab => {
  tab.addEventListener('click', () => switchTab(tab.dataset.tab));
});

if (location.hash) {
  const h = location.hash.slice(1);
  if (TAB_TITLES[h]) setTimeout(() => switchTab(h), 50);
}

function updateTabBadges() {
  const isLive = !!(allData?.bilibili && (allData.bilibili.is_live || allData.bilibili.is_ig_live));
  const dot = document.getElementById('tab-esports-dot');
  if (dot) dot.style.display = isLive ? 'block' : 'none';

  const events = currentData.events || [];
  const recent = events.filter(e => Date.now() - (e.ts||e.timestamp||0) < 3600000).length;
  const badge = document.getElementById('tab-activity-badge');
  if (badge) {
    if (recent > 0) {
      badge.style.display = 'flex';
      badge.textContent = recent > 9 ? '9+' : recent;
    } else {
      badge.style.display = 'none';
    }
  }
}

// 事件筛选
document.querySelectorAll('#filter-chips .filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#filter-chips .filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    eventFilter = chip.dataset.filter;
    renderEvents();
  });
});

// 刷新按钮
document.getElementById('refresh-btn').addEventListener('click', refresh);

// 自动刷新
let timer = null;
function startAuto(sec) {
  if (timer) clearInterval(timer);
  if (sec > 0) timer = setInterval(refresh, sec * 1000);
}
startAuto(60);

// 启动
refresh();

// 阻止双指缩放
document.addEventListener('gesturestart', e => e.preventDefault());
</script>
